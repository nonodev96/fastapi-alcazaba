[build-system]
requires = ["hatchling>=1.27", "hatch-vcs>=0.5"]
build-backend = "hatchling.build"

[project]
name = "fastapi-alcazaba"
dynamic = ["version"]
description = "Secure, maintained tools for FastAPI: response cache, rate limits, sessions, CSRF, webhooks, a task queue and more"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.11"
authors = [{ name = "Antonio Mudarra Machuca", email = "nonodev96@gmail.com" }]
keywords = ["fastapi", "toolkit", "cache", "caching", "rate-limiting", "pagination", "scheduler", "cron", "circuit-breaker", "redis", "valkey", "security"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet :: WWW/HTTP",
    "Typing :: Typed",
]
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2.7",
    "typing-extensions>=4.10",
]

[project.optional-dependencies]
redis = ["redis>=5.0.8"]
valkey = ["valkey>=6.0"]
glide = ["valkey-glide>=2.5"]
otel = ["opentelemetry-api>=1.27"]
crypto = ["cryptography>=44"]
# zstd is in the standard library from Python 3.14.
zstd = ["backports.zstd>=1.0; python_version < '3.14'"]
memcache = ["aiomcache>=0.8.2"]
dynamodb = ["aiobotocore>=2.13.1"]
all = ["fastapi-alcazaba[redis,valkey,glide,memcache,dynamodb,otel,crypto,zstd]"]

[project.urls]
Homepage = "https://github.com/nonodev96/fastapi-alcazaba"
Documentation = "https://nonodev96.github.io/fastapi-alcazaba/"
Repository = "https://github.com/nonodev96/fastapi-alcazaba"
Issues = "https://github.com/nonodev96/fastapi-alcazaba/issues"
Changelog = "https://github.com/nonodev96/fastapi-alcazaba/blob/main/CHANGELOG.md"

# Install with pip 26.2 or later: pip install -e ".[all]" --group dev (`make deps` does it).
[dependency-groups]
dev = [
    "actionlint-py>=1.7.12.25",
    "coverage[toml]>=7.16.2",
    "cyclonedx-python-lib[json-validation]>=11.12",
    "fakeredis[lua]>=2.40.0",
    "hypothesis>=6.170.5",
    "httpx2>=2.15.1",
    "jinja2>=3.1.6",
    "mutmut>=3.8.0",
    "mypy>=2.4.0",
    "opentelemetry-sdk>=1.45.1",
    "pip-audit>=2.10.1",
    "pre-commit>=4.7.0",
    "pydantic-settings>=2.16",
    "pylint>=4.1.3",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-benchmark>=5.3.0",
    "pytest-randomly>=5.0.0",
    "python-multipart>=0.0.32",
    "ruff>=0.17.1",
    "shellcheck-py>=0.11.0.1",
    "types-aiobotocore[dynamodb]>=3.9.2",
    "uvicorn>=0.54.0",
    "zizmor>=1.31.1",
]

# The documentation site. MkDocs 2.0 drops plugins and themes, so neither Material nor
# mkdocstrings would work with it: it stays on 1.x. Material stays on 9.7.1, the last release
# that doesn't print a notice about MkDocs 2.0 on every build; its search suggestions have an XSS
# (GHSA-xvg9-69gf-fjrf, fixed in 9.7.7), so mkdocs.yml leaves them off.
docs = [
    "mkdocs>=1.6.1,<2",
    "mkdocs-material==9.7.1",
    "mkdocstrings-python>=2.0.10",
]

# Building and checking the distributions (CI and releases).
package = [
    "build>=1.6.1",
    "check-wheel-contents>=0.6.3",
    "twine>=7.0",
]

# The version comes from the Git tag (vX.Y.Z); between tags it's a .devN version.
[tool.hatch.version]
source = "vcs"

[tool.hatch.version.raw-options]
local_scheme = "no-local-version"

[tool.hatch.build.targets.wheel]
packages = ["fastapi_alcazaba"]

[tool.hatch.build.targets.sdist]
include = ["fastapi_alcazaba", "tests", "examples", "fuzz", "README.md", "CHANGELOG.md", "SECURITY.md", "LICENSE", "NOTICE"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "S",   # flake8-bandit
    "W",   # pycodestyle warnings
    "UP",  # pyupgrade
]

[tool.ruff.lint.isort]
known-first-party = ["examples", "fastapi_alcazaba", "fuzz"]

[tool.pylint.main]
py-version = "3.11"
jobs = 0

[tool.pylint.format]
max-line-length = 100

[tool.pylint.variables]
# Arguments a caller passes whatever the function needs: ASGI's scope, receive and send, request
# and exc to Starlette's exception handlers and httpx's mock handlers, app to a lifespan.
ignored-argument-names = "_.*|^ignored_|^unused_|^(scope|receive|send|request|response|exc|app)$"

[tool.pylint.exceptions]
# Exception is caught on purpose where the app must go on whatever fails (a backend: the cache
# fails open; a task, a check, a scheduled job), and logged there. BaseException never is.
overgeneral-exceptions = ["builtins.BaseException"]

[tool.pylint."messages control"]
disable = [
    # Docstrings go where they tell something, not on every test, fake and helper.
    "missing-module-docstring",
    "missing-class-docstring",
    "missing-function-docstring",
    # ruff sorts and groups the imports.
    "wrong-import-order",
    "ungrouped-imports",
    "wrong-import-position",
    # Imported where it's needed: optional dependencies stay optional, and cycles are broken.
    "import-outside-toplevel",
    "cyclic-import",
    # Sizes: the API takes keyword options, and models, fakes and handlers have few methods.
    "too-few-public-methods",
    "too-many-arguments",
    "too-many-positional-arguments",
    "too-many-instance-attributes",
    "too-many-locals",
    "too-many-branches",
    "too-many-return-statements",
    "too-many-public-methods",
    "too-many-lines",
    "too-many-boolean-expressions",
    "too-many-ancestors",
    # Each test and example sets itself up, to read on its own.
    "duplicate-code",
    # Exact type checks on purpose: JSON's true and false must not pass for integers.
    "unidiomatic-typecheck",
    # Tests compare with [] and {}: a failure shows what was there, and of which type.
    "use-implicit-booleaness-not-comparison",
]

[tool.mypy]
files = ["fastapi_alcazaba", "tests", "scripts", "fuzz"]
python_version = "3.11"
strict = true
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["aiomcache.*", "atheris", "fakeredis.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
# Suites: tests/unit (default), tests/integration and tests/e2e (need servers, skipped
# otherwise), tests/benchmarks (only with --benchmark-only) and tests/typing (checked by mypy).
addopts = "--benchmark-skip"
# A test still running after this many seconds prints the stack of every thread: where it hangs.
faulthandler_timeout = 120
markers = [
    "integration: needs real servers (REDIS_URL, VALKEY_URL, CLUSTER_URL, MEMCACHED_URL, DYNAMODB_URL)",
    "e2e: runs the example app in uvicorn processes against a real Valkey (VALKEY_URL)",
    "benchmark: performance measurements (pytest-benchmark)",
    "cache_options: keyword arguments for FastAPICache.init() in test_decorator",
]
filterwarnings = [
    "error",
    # valkey-glide's deprecated module aliases warn when hypothesis' plugin walks sys.modules.
    "ignore:Importing from 'glide.:DeprecationWarning",
]

[tool.mutmut]
# Mutation testing (make mutation): mutmut changes the code and checks that some test fails.
source_paths = ["fastapi_alcazaba/"]
also_copy = ["examples/", "tests/"]
pytest_add_cli_args = ["-q", "-p", "no:cacheprovider", "-x"]
pytest_add_cli_args_test_selection = ["tests/unit/", "tests/typing/"]

[tool.coverage.run]
branch = true
source = ["fastapi_alcazaba"]

[tool.coverage.report]
show_missing = true
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError"]

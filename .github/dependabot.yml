version: 2
updates:
  # The ranges of pyproject.toml; CI and contributors install the latest releases in them that
  # are at least three days old (pip's --uploaded-prior-to).
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
    # Wait a week before proposing a release: compromised versions are usually pulled sooner.
    cooldown:
      default-days: 7
    ignore:
      # Pinned to 9.7.1 on purpose: see the docs group of pyproject.toml.
      - dependency-name: mkdocs-material
      # The library's own requirements: their lower bounds are the oldest releases it works with,
      # not the newest, so that apps on older versions can install it; CI tests the newest anyway.
      # Raise one when the code needs it. The development tools do rise.
      - dependency-name: fastapi
      - dependency-name: pydantic
      - dependency-name: typing-extensions
      - dependency-name: redis
      - dependency-name: valkey
      - dependency-name: valkey-glide
      - dependency-name: opentelemetry-api
      - dependency-name: cryptography
      - dependency-name: backports.zstd
      - dependency-name: aiomcache
      - dependency-name: aiobotocore
      # And what builds the sdist.
      - dependency-name: hatchling
      - dependency-name: hatch-vcs
    groups:
      python:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directories: ["/", "/.github/actions/python"]
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
  # The requirements of the fuzzing build, pinned by hash for the image's Python. A release that
  # brings a new requirement fails that build: `make fuzz-requirements` writes the file again.
  - package-ecosystem: pip
    directory: "/.clusterfuzzlite"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      fuzzing:
        patterns: ["*"]
  # The image ClusterFuzzLite builds the fuzzers in, pinned by digest. It's rebuilt every day:
  # monthly is enough.
  - package-ecosystem: docker
    directory: "/.clusterfuzzlite"
    schedule:
      interval: monthly
    cooldown:
      default-days: 7

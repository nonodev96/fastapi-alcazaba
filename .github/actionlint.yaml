# actionlint 1.7.12 doesn't know GitHub's self-repository syntax yet (`uses: $/...`, July 2026),
# which zizmor asks for: the action of this repository at the commit that runs.
paths:
  .github/workflows/**/*.{yml,yaml}:
    ignore:
      - 'specifying action "\$/[^"]+" in invalid format because ref is missing'

# Nor GitHub's Ubuntu 26.04 image (generally available since October 2026): it isn't a
# self-hosted runner, it's newer than actionlint's list of GitHub's labels.
self-hosted-runner:
  labels:
    - ubuntu-26.04

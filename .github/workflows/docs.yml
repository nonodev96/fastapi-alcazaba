name: Docs

# Publishes the documentation site to GitHub Pages (Settings → Pages → Source: GitHub Actions).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  # pip takes no release younger than three days: compromised versions are usually pulled sooner.
  PIP_UPLOADED_PRIOR_TO: P3D
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    # A fixed image, not ubuntu-latest: that one moves to a new Ubuntu on GitHub's schedule, and
    # for weeks a job may run on either. This one changes when the workflows do.
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        id: pages
      - uses: $/.github/actions/python
        with:
          groups: docs
          cache: ""
      - name: Build the site
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}/
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: mkdocs build --strict
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site/

  deploy:
    name: Deploy
    needs: [build]
    runs-on: ubuntu-26.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        id: deployment

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  # pip takes no release younger than three days: compromised versions are usually pulled sooner.
  PIP_UPLOADED_PRIOR_TO: P3D
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint and type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/python
      - run: ruff check .
      - run: python scripts/check_signatures.py fastapi_alcazaba examples tests scripts
      - run: ruff format --check .
      # Includes tests/typing: the decorator must keep the signatures.
      - run: mypy
      - run: pylint fastapi_alcazaba examples tests scripts

  test:
    name: Unit and integration tests (${{ matrix.python }})
    runs-on: ubuntu-latest
    # A run takes about 3 minutes: a test that hangs fails the job instead of holding it for 6 h.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
    services:
      redis:
        image: redis:8
        ports: ["6379:6379"]
      valkey:
        image: valkey/valkey:8
        ports: ["6380:6379"]
      memcached:
        image: memcached:1.6
        ports: ["11211:11211"]
      dynamodb:
        image: amazon/dynamodb-local:3.3.2
        ports: ["8000:8000"]
    env:
      REDIS_URL: redis://localhost:6379/15
      VALKEY_URL: valkey://localhost:6380/15
      CLUSTER_URL: redis://localhost:16382
      MEMCACHED_URL: localhost:11211
      DYNAMODB_URL: http://localhost:8000
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Service containers can't take a command: a single-node cluster owning every slot.
      - name: Start a Valkey cluster
        run: |
          docker run -d --name valkey-cluster -p 16382:16382 valkey/valkey:8 \
            valkey-server --port 16382 --cluster-enabled yes --cluster-announce-ip 127.0.0.1
          for _ in $(seq 30); do docker exec valkey-cluster valkey-cli -p 16382 ping && break; sleep 1; done
          docker exec valkey-cluster valkey-cli -p 16382 cluster addslotsrange 0 16383
          for _ in $(seq 30); do
            docker exec valkey-cluster valkey-cli -p 16382 cluster info | grep -q cluster_state:ok && break
            sleep 1
          done
      - uses: $/.github/actions/python
        with:
          python-version: ${{ matrix.python }}
      - run: coverage run -m pytest tests/unit tests/integration tests/typing
      - run: coverage report --fail-under=90

  e2e:
    name: End-to-end
    runs-on: ubuntu-latest
    services:
      valkey:
        image: valkey/valkey:8
        ports: ["6380:6379"]
    env:
      VALKEY_URL: valkey://localhost:6380/15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/python
      - run: pytest tests/e2e

  package:
    name: Package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # the version comes from the Git history
      - uses: $/.github/actions/python
        with:
          groups: dev package
      - run: python -m build
      - run: twine check --strict dist/*
      - run: check-wheel-contents dist/*.whl
      - name: Smoke test of the installed wheel
        run: |
          # In an environment of its own, with nothing but the wheel and what it requires.
          python -m venv "$RUNNER_TEMP/smoke"
          "$RUNNER_TEMP/smoke/bin/python" -m pip install --quiet dist/*.whl
          "$RUNNER_TEMP/smoke/bin/python" -I scripts/smoke_test.py
      - name: SBOM
        run: python scripts/sbom.py dist/*.whl -o sbom/fastapi-alcazaba.cdx.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package
          path: |
            dist/
            sbom/

  audit:
    name: Audit dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/python
      - name: The runtime dependencies, every extra
        run: |
          python -m venv "$RUNNER_TEMP/runtime"
          "$RUNNER_TEMP/runtime/bin/python" -m pip install --quiet ".[all]"
          "$RUNNER_TEMP/runtime/bin/python" -m pip freeze --exclude fastapi-alcazaba > requirements.txt
      - run: pip-audit --strict -r requirements.txt

  docs:
    name: Docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/python
        with:
          groups: docs
      - run: mkdocs build --strict

  benchmarks:
    name: Benchmarks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/python
      - run: pytest tests/benchmarks --benchmark-only --benchmark-json=benchmarks.json
      # The last results of main, saved in the Actions cache (pull requests can read the base
      # branch's caches). No write permission needed.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: benchmark-history
          key: benchmarks-${{ github.sha }}
          restore-keys: benchmarks-
      # A benchmark more than 50 % slower than the others fails the job. The runner's speed
      # changes between runs, so absolute numbers only go to the summary below.
      - run: python scripts/bench_gate.py benchmarks.json benchmark-history/data.json
      - if: ${{ !cancelled() }}
        uses: benchmark-action/github-action-benchmark@4322e5726e6334590d251fc4f92bec0efafc45dc # v1.22.2
        with:
          tool: pytest
          output-file-path: benchmarks.json
          external-data-json-path: benchmark-history/data.json
          alert-threshold: "150%"
          fail-on-alert: false
          summary-always: true
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: benchmark-history
          key: benchmarks-${{ github.sha }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: benchmarks
          path: benchmarks.json

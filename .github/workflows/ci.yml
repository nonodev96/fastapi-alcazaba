name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint and type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
      - run: uv sync --locked --all-extras
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      # Includes tests/typing: the decorator must keep the signatures.
      - run: uv run mypy

  test:
    name: Unit and integration tests (${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
    services:
      redis:
        image: redis:8
        ports: ["6379:6379"]
      valkey:
        image: valkey/valkey:8
        ports: ["6380:6379"]
      memcached:
        image: memcached:1.6
        ports: ["11211:11211"]
      dynamodb:
        image: amazon/dynamodb-local:3.3.2
        ports: ["8000:8000"]
    env:
      REDIS_URL: redis://localhost:6379/15
      VALKEY_URL: valkey://localhost:6380/15
      CLUSTER_URL: redis://localhost:16382
      MEMCACHED_URL: localhost:11211
      DYNAMODB_URL: http://localhost:8000
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Service containers can't take a command: a single-node cluster owning every slot.
      - name: Start a Valkey cluster
        run: |
          docker run -d --name valkey-cluster -p 16382:16382 valkey/valkey:8 \
            valkey-server --port 16382 --cluster-enabled yes --cluster-announce-ip 127.0.0.1
          for _ in $(seq 30); do docker exec valkey-cluster valkey-cli -p 16382 ping && break; sleep 1; done
          docker exec valkey-cluster valkey-cli -p 16382 cluster addslotsrange 0 16383
          for _ in $(seq 30); do
            docker exec valkey-cluster valkey-cli -p 16382 cluster info | grep -q cluster_state:ok && break
            sleep 1
          done
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
          python-version: ${{ matrix.python }}
      - run: uv sync --locked --all-extras
      - run: uv run coverage run -m pytest tests/unit tests/integration tests/typing
      - run: uv run coverage report --fail-under=90

  e2e:
    name: End-to-end
    runs-on: ubuntu-latest
    services:
      valkey:
        image: valkey/valkey:8
        ports: ["6380:6379"]
    env:
      VALKEY_URL: valkey://localhost:6380/15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
      - run: uv sync --locked --all-extras
      - run: uv run pytest tests/e2e

  package:
    name: Package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # the version comes from the Git history
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
      - run: uv build
      - run: uvx twine@7.0.0 check --strict dist/*
      - run: uvx check-wheel-contents@0.6.3 dist/*.whl
      - name: Smoke test of the installed wheel
        run: uv run --isolated --no-project --with dist/*.whl python -I scripts/smoke_test.py
      - name: SBOM
        run: |
          version=$(basename dist/*.whl | cut -d- -f2)
          # The components come from `uv export --no-dev`; the environment only provides licences.
          uv sync --frozen --all-extras
          uv run --no-sync python scripts/sbom.py --version "$version" -o sbom/fastapi-alcazaba.cdx.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package
          path: |
            dist/
            sbom/

  audit:
    name: Audit dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
      - run: uv export --frozen --all-extras --no-hashes --no-emit-project --format requirements-txt -o requirements.txt
      - run: uvx pip-audit@2.10.1 --strict -r requirements.txt

  docs:
    name: Docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
      - run: uv run --locked --group docs mkdocs build --strict

  benchmarks:
    name: Benchmarks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
      - run: uv sync --locked --all-extras
      - run: uv run pytest tests/benchmarks --benchmark-only --benchmark-json=benchmarks.json
      # The last results of main, saved in the Actions cache (pull requests can read the base
      # branch's caches): a regression of more than 50 % fails the job. No write permission needed.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: benchmark-history
          key: benchmarks-${{ github.sha }}
          restore-keys: benchmarks-
      - uses: benchmark-action/github-action-benchmark@4322e5726e6334590d251fc4f92bec0efafc45dc # v1.22.2
        with:
          tool: pytest
          output-file-path: benchmarks.json
          external-data-json-path: benchmark-history/data.json
          alert-threshold: "150%"
          fail-on-alert: true
          summary-always: true
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: benchmark-history
          key: benchmarks-${{ github.sha }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: benchmarks
          path: benchmarks.json

<desc id="alc-pagination_keyset-desc">Client to Your app: GET /products?after=WzQu… Your app to Database: (price, id) &gt; key, LIMIT 4. Your app to Client: 200, keys: before, after. Client to Your app: GET /products?before=WzUu… Your app to Database: (price, id) &lt; key, DESC. Your app to Client: 200, the page before. Client to Your app: ?after=…&amp;before=… Your app to Client: 400, not both. Pages on both sides of a key, each through the index.</desc>

<figure class="alc-anim">
<svg viewBox="0 0 640 418" role="img" aria-labelledby="alc-operations-title alc-operations-desc" xmlns="http://www.w3.org/2000/svg">
<title id="alc-operations-title">Operations</title>
<desc id="alc-operations-desc">Admin to Your app: PUT /admin/maintenance. Users to Your app: GET /checkout. Your app to Users: 503, Retry-After: 900. Admin to Your app: DELETE /admin/maintenance. Admin to Your app: new-checkout: 30 %. Users to Your app: GET /checkout. Your app: is the user in the 30 %? Your app to Users: 200, new or classic. Close, reopen and roll out at runtime, without a deploy.</desc>
<line class="alc-life" x1="100" y1="52" x2="100" y2="366"/>
<g class="alc-actor"><rect x="18" y="10" width="164" height="42" rx="8"/><text x="100" y="36">Users</text></g>
<line class="alc-life" x1="320" y1="52" x2="320" y2="366"/>
<g class="alc-actor"><rect x="238" y="10" width="164" height="42" rx="8"/><text x="320" y="36">Your app</text></g>
<line class="alc-life" x1="540" y1="52" x2="540" y2="366"/>
<g class="alc-actor"><rect x="458" y="10" width="164" height="42" rx="8"/><text x="540" y="36">Admin</text></g>
<g class="alc-step alc-request alc-s1"><line x1="534" y1="92" x2="334" y2="92"/><polygon points="326,92 336,87 336,97"/><text class="alc-label" x="430" y="84">PUT /admin/maintenance</text></g>
<circle class="alc-dot alc-request alc-m1" cx="534" cy="92" r="5" style="--dx: -208px"/>
<g class="alc-step alc-request alc-s2"><line x1="106" y1="128" x2="306" y2="128"/><polygon points="314,128 304,123 304,133"/><text class="alc-label" x="210" y="120">GET /checkout</text></g>
<circle class="alc-dot alc-request alc-m2" cx="106" cy="128" r="5" style="--dx: 208px"/>
<g class="alc-step alc-refused alc-s3"><line x1="314" y1="164" x2="114" y2="164"/><polygon points="106,164 116,159 116,169"/><text class="alc-label" x="210" y="156">503, Retry-After: 900</text></g>
<circle class="alc-dot alc-refused alc-m3" cx="314" cy="164" r="5" style="--dx: -208px"/>
<g class="alc-step alc-request alc-s4"><line x1="534" y1="200" x2="334" y2="200"/><polygon points="326,200 336,195 336,205"/><text class="alc-label" x="430" y="192">DELETE /admin/maintenance</text></g>
<circle class="alc-dot alc-request alc-m4" cx="534" cy="200" r="5" style="--dx: -208px"/>
<g class="alc-step alc-request alc-s5"><line x1="534" y1="236" x2="334" y2="236"/><polygon points="326,236 336,231 336,241"/><text class="alc-label" x="430" y="228">new-checkout: 30 %</text></g>
<circle class="alc-dot alc-request alc-m5" cx="534" cy="236" r="5" style="--dx: -208px"/>
<g class="alc-step alc-request alc-s6"><line x1="106" y1="272" x2="306" y2="272"/><polygon points="314,272 304,267 304,277"/><text class="alc-label" x="210" y="264">GET /checkout</text></g>
<circle class="alc-dot alc-request alc-m6" cx="106" cy="272" r="5" style="--dx: 208px"/>
<g class="alc-step alc-note alc-s7"><rect x="216" y="294" width="208" height="26" rx="13"/><text class="alc-label" x="320" y="312">is the user in the 30 %?</text></g>
<g class="alc-step alc-reply alc-s8"><line x1="314" y1="344" x2="114" y2="344"/><polygon points="106,344 116,339 116,349"/><text class="alc-label" x="210" y="336">200, new or classic</text></g>
<circle class="alc-dot alc-reply alc-m8" cx="314" cy="344" r="5" style="--dx: -208px"/>
<g class="alc-step alc-banner alc-s9"><rect x="20" y="374" width="600" height="34" rx="17"/><text x="320" y="396">Close, reopen and roll out at runtime, without a deploy</text></g>
</svg>
<figcaption>What it&#x27;s for: switches flipped at runtime, without a deploy: maintenance mode, features rolled out to some of the users, and a breaker for a service that&#x27;s down.</figcaption>
</figure>

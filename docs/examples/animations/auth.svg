<figure class="alc-anim">
<svg viewBox="0 0 640 418" role="img" aria-labelledby="alc-auth-title alc-auth-desc" xmlns="http://www.w3.org/2000/svg">
<title id="alc-auth-title">API keys, tokens and codes</title>
<desc id="alc-auth-desc">Owner to Your app: POST /login/code, e-mail. Your app to Owner: a code, by e-mail. Owner to Your app: POST /login, the code. Your app to Owner: an access token. Owner to Your app: POST /api-keys, token. Your app to Owner: acme_…, shown once. Program to Your app: GET /orders, X-API-Key. Your app to Program: 200, its owner&#x27;s orders. Codes for people, keys for programs, only digests stored.</desc>
<line class="alc-life" x1="100" y1="52" x2="100" y2="366"/>
<g class="alc-actor"><rect x="18" y="10" width="164" height="42" rx="8"/><text x="100" y="36">Owner</text></g>
<line class="alc-life" x1="320" y1="52" x2="320" y2="366"/>
<g class="alc-actor"><rect x="238" y="10" width="164" height="42" rx="8"/><text x="320" y="36">Your app</text></g>
<line class="alc-life" x1="540" y1="52" x2="540" y2="366"/>
<g class="alc-actor"><rect x="458" y="10" width="164" height="42" rx="8"/><text x="540" y="36">Program</text></g>
<g class="alc-step alc-request alc-s1"><line x1="106" y1="92" x2="306" y2="92"/><polygon points="314,92 304,87 304,97"/><text class="alc-label" x="210" y="84">POST /login/code, e-mail</text></g>
<circle class="alc-dot alc-request alc-m1" cx="106" cy="92" r="5" style="--dx: 208px"/>
<g class="alc-step alc-reply alc-s2"><line x1="314" y1="128" x2="114" y2="128"/><polygon points="106,128 116,123 116,133"/><text class="alc-label" x="210" y="120">a code, by e-mail</text></g>
<circle class="alc-dot alc-reply alc-m2" cx="314" cy="128" r="5" style="--dx: -208px"/>
<g class="alc-step alc-request alc-s3"><line x1="106" y1="164" x2="306" y2="164"/><polygon points="314,164 304,159 304,169"/><text class="alc-label" x="210" y="156">POST /login, the code</text></g>
<circle class="alc-dot alc-request alc-m3" cx="106" cy="164" r="5" style="--dx: 208px"/>
<g class="alc-step alc-reply alc-s4"><line x1="314" y1="200" x2="114" y2="200"/><polygon points="106,200 116,195 116,205"/><text class="alc-label" x="210" y="192">an access token</text></g>
<circle class="alc-dot alc-reply alc-m4" cx="314" cy="200" r="5" style="--dx: -208px"/>
<g class="alc-step alc-request alc-s5"><line x1="106" y1="236" x2="306" y2="236"/><polygon points="314,236 304,231 304,241"/><text class="alc-label" x="210" y="228">POST /api-keys, token</text></g>
<circle class="alc-dot alc-request alc-m5" cx="106" cy="236" r="5" style="--dx: 208px"/>
<g class="alc-step alc-reply alc-s6"><line x1="314" y1="272" x2="114" y2="272"/><polygon points="106,272 116,267 116,277"/><text class="alc-label" x="210" y="264">acme_…, shown once</text></g>
<circle class="alc-dot alc-reply alc-m6" cx="314" cy="272" r="5" style="--dx: -208px"/>
<g class="alc-step alc-request alc-s7"><line x1="534" y1="308" x2="334" y2="308"/><polygon points="326,308 336,303 336,313"/><text class="alc-label" x="430" y="300">GET /orders, X-API-Key</text></g>
<circle class="alc-dot alc-request alc-m7" cx="534" cy="308" r="5" style="--dx: -208px"/>
<g class="alc-step alc-reply alc-s8"><line x1="326" y1="344" x2="526" y2="344"/><polygon points="534,344 524,339 524,349"/><text class="alc-label" x="430" y="336">200, its owner&#x27;s orders</text></g>
<circle class="alc-dot alc-reply alc-m8" cx="326" cy="344" r="5" style="--dx: 208px"/>
<g class="alc-step alc-banner alc-s9"><rect x="20" y="374" width="600" height="34" rx="17"/><text x="320" y="396">Codes for people, keys for programs, only digests stored</text></g>
</svg>
<figcaption>What it&#x27;s for: people sign in with a one-time code and get a revocable token; their programs call the API with keys that are stored only as digests.</figcaption>
</figure>

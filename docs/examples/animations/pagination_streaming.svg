<figure class="alc-anim">
<svg viewBox="0 0 640 418" role="img" aria-labelledby="alc-pagination_streaming-title alc-pagination_streaming-desc" xmlns="http://www.w3.org/2000/svg">
<title id="alc-pagination_streaming-title">PaginationStreaming</title>
<desc id="alc-pagination_streaming-desc">Client to Your app: GET /events. Your app to Database: ORDER BY id LIMIT 100. Your app to Client: 200, 100 lines of NDJSON. Your app to Database: id &gt; 100 LIMIT 100. Your app to Client: 100 more lines. Your app to Database: id &gt; 200 LIMIT 100. Database to Your app: 50 rows: the last batch. Your app to Client: 50 lines, end. Every item in one response, read and sent a batch at a time.</desc>
<line class="alc-life" x1="100" y1="52" x2="100" y2="366"/>
<g class="alc-actor"><rect x="18" y="10" width="164" height="42" rx="8"/><text x="100" y="36">Client</text></g>
<line class="alc-life" x1="320" y1="52" x2="320" y2="366"/>
<g class="alc-actor"><rect x="238" y="10" width="164" height="42" rx="8"/><text x="320" y="36">Your app</text></g>
<line class="alc-life" x1="540" y1="52" x2="540" y2="366"/>
<g class="alc-actor"><rect x="458" y="10" width="164" height="42" rx="8"/><text x="540" y="36">Database</text></g>
<g class="alc-step alc-request alc-s1"><line x1="106" y1="92" x2="306" y2="92"/><polygon points="314,92 304,87 304,97"/><text class="alc-label" x="210" y="84">GET /events</text></g>
<circle class="alc-dot alc-request alc-m1" cx="106" cy="92" r="5" style="--dx: 208px"/>
<g class="alc-step alc-request alc-s2"><line x1="326" y1="128" x2="526" y2="128"/><polygon points="534,128 524,123 524,133"/><text class="alc-label" x="430" y="120">ORDER BY id LIMIT 100</text></g>
<circle class="alc-dot alc-request alc-m2" cx="326" cy="128" r="5" style="--dx: 208px"/>
<g class="alc-step alc-reply alc-s3"><line x1="314" y1="164" x2="114" y2="164"/><polygon points="106,164 116,159 116,169"/><text class="alc-label" x="210" y="156">200, 100 lines of NDJSON</text></g>
<circle class="alc-dot alc-reply alc-m3" cx="314" cy="164" r="5" style="--dx: -208px"/>
<g class="alc-step alc-request alc-s4"><line x1="326" y1="200" x2="526" y2="200"/><polygon points="534,200 524,195 524,205"/><text class="alc-label" x="430" y="192">id &gt; 100 LIMIT 100</text></g>
<circle class="alc-dot alc-request alc-m4" cx="326" cy="200" r="5" style="--dx: 208px"/>
<g class="alc-step alc-reply alc-s5"><line x1="314" y1="236" x2="114" y2="236"/><polygon points="106,236 116,231 116,241"/><text class="alc-label" x="210" y="228">100 more lines</text></g>
<circle class="alc-dot alc-reply alc-m5" cx="314" cy="236" r="5" style="--dx: -208px"/>
<g class="alc-step alc-request alc-s6"><line x1="326" y1="272" x2="526" y2="272"/><polygon points="534,272 524,267 524,277"/><text class="alc-label" x="430" y="264">id &gt; 200 LIMIT 100</text></g>
<circle class="alc-dot alc-request alc-m6" cx="326" cy="272" r="5" style="--dx: 208px"/>
<g class="alc-step alc-reply alc-s7"><line x1="534" y1="308" x2="334" y2="308"/><polygon points="326,308 336,303 336,313"/><text class="alc-label" x="430" y="300">50 rows: the last batch</text></g>
<circle class="alc-dot alc-reply alc-m7" cx="534" cy="308" r="5" style="--dx: -208px"/>
<g class="alc-step alc-reply alc-s8"><line x1="314" y1="344" x2="114" y2="344"/><polygon points="106,344 116,339 116,349"/><text class="alc-label" x="210" y="336">50 lines, end</text></g>
<circle class="alc-dot alc-reply alc-m8" cx="314" cy="344" r="5" style="--dx: -208px"/>
<g class="alc-step alc-banner alc-s9"><rect x="20" y="374" width="600" height="34" rx="17"/><text x="320" y="396">Every item in one response, read and sent a batch at a time</text></g>
</svg>
<figcaption>What it&#x27;s for: every item in one response, as they come, without pages, read from a big table a batch at a time by key.</figcaption>
</figure>

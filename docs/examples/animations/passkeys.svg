<figure class="alc-anim">
<svg viewBox="0 0 640 418" role="img" aria-labelledby="alc-passkeys-title alc-passkeys-desc" xmlns="http://www.w3.org/2000/svg">
<title id="alc-passkeys-title">Passkeys</title>
<desc id="alc-passkeys-desc">Browser to Your app: POST /login/options. Your app to Challenges: a random challenge. Your app to Browser: challenge, rpId. Browser: Touch ID signs it. Browser to Your app: POST /login, signature. Your app to Challenges: used once? Your app to Browser: 200, logged in. Your app to Browser: a phishing site: 401. Signed for this site only: nothing a phishing page can use.</desc>
<line class="alc-life" x1="100" y1="52" x2="100" y2="366"/>
<g class="alc-actor"><rect x="18" y="10" width="164" height="42" rx="8"/><text x="100" y="36">Browser</text></g>
<line class="alc-life" x1="320" y1="52" x2="320" y2="366"/>
<g class="alc-actor"><rect x="238" y="10" width="164" height="42" rx="8"/><text x="320" y="36">Your app</text></g>
<line class="alc-life" x1="540" y1="52" x2="540" y2="366"/>
<g class="alc-actor"><rect x="458" y="10" width="164" height="42" rx="8"/><text x="540" y="36">Challenges</text></g>
<g class="alc-step alc-request alc-s1"><line x1="106" y1="92" x2="306" y2="92"/><polygon points="314,92 304,87 304,97"/><text class="alc-label" x="210" y="84">POST /login/options</text></g>
<circle class="alc-dot alc-request alc-m1" cx="106" cy="92" r="5" style="--dx: 208px"/>
<g class="alc-step alc-request alc-s2"><line x1="326" y1="128" x2="526" y2="128"/><polygon points="534,128 524,123 524,133"/><text class="alc-label" x="430" y="120">a random challenge</text></g>
<circle class="alc-dot alc-request alc-m2" cx="326" cy="128" r="5" style="--dx: 208px"/>
<g class="alc-step alc-reply alc-s3"><line x1="314" y1="164" x2="114" y2="164"/><polygon points="106,164 116,159 116,169"/><text class="alc-label" x="210" y="156">challenge, rpId</text></g>
<circle class="alc-dot alc-reply alc-m3" cx="314" cy="164" r="5" style="--dx: -208px"/>
<g class="alc-step alc-note alc-s4"><rect x="23" y="186" width="155" height="26" rx="13"/><text class="alc-label" x="100" y="204">Touch ID signs it</text></g>
<g class="alc-step alc-request alc-s5"><line x1="106" y1="236" x2="306" y2="236"/><polygon points="314,236 304,231 304,241"/><text class="alc-label" x="210" y="228">POST /login, signature</text></g>
<circle class="alc-dot alc-request alc-m5" cx="106" cy="236" r="5" style="--dx: 208px"/>
<g class="alc-step alc-request alc-s6"><line x1="326" y1="272" x2="526" y2="272"/><polygon points="534,272 524,267 524,277"/><text class="alc-label" x="430" y="264">used once?</text></g>
<circle class="alc-dot alc-request alc-m6" cx="326" cy="272" r="5" style="--dx: 208px"/>
<g class="alc-step alc-reply alc-s7"><line x1="314" y1="308" x2="114" y2="308"/><polygon points="106,308 116,303 116,313"/><text class="alc-label" x="210" y="300">200, logged in</text></g>
<circle class="alc-dot alc-reply alc-m7" cx="314" cy="308" r="5" style="--dx: -208px"/>
<g class="alc-step alc-refused alc-s8"><line x1="314" y1="344" x2="114" y2="344"/><polygon points="106,344 116,339 116,349"/><text class="alc-label" x="210" y="336">a phishing site: 401</text></g>
<circle class="alc-dot alc-refused alc-m8" cx="314" cy="344" r="5" style="--dx: -208px"/>
<g class="alc-step alc-banner alc-s9"><rect x="20" y="374" width="600" height="34" rx="17"/><text x="320" y="396">Signed for this site only: nothing a phishing page can use</text></g>
</svg>
<figcaption>What it&#x27;s for: logins without a password, signed by the user&#x27;s device for this site only, which a phishing page can&#x27;t relay.</figcaption>
</figure>

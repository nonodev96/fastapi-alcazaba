<figure class="alc-anim">
<svg viewBox="0 0 640 382" role="img" aria-labelledby="alc-auth_session-title alc-auth_session-desc" xmlns="http://www.w3.org/2000/svg">
<title id="alc-auth_session-title">SessionStrategy</title>
<desc id="alc-auth_session-desc">Browser to Your app: POST /login, password. Your app to Sessions: new session: user 1. Your app to Browser: Set-Cookie: session=&lt;id&gt;. Browser to Your app: GET /me, Cookie: session. Your app to Sessions: load session &lt;id&gt;. Sessions to Your app: user 1. Your app to Browser: 200 {&quot;login&quot;: &quot;octocat&quot;}. The browser holds an id; the user stays on the server.</desc>
<line class="alc-life" x1="100" y1="52" x2="100" y2="330"/>
<g class="alc-actor"><rect x="18" y="10" width="164" height="42" rx="8"/><text x="100" y="36">Browser</text></g>
<line class="alc-life" x1="320" y1="52" x2="320" y2="330"/>
<g class="alc-actor"><rect x="238" y="10" width="164" height="42" rx="8"/><text x="320" y="36">Your app</text></g>
<line class="alc-life" x1="540" y1="52" x2="540" y2="330"/>
<g class="alc-actor"><rect x="458" y="10" width="164" height="42" rx="8"/><text x="540" y="36">Sessions</text></g>
<g class="alc-step alc-request alc-s1"><line x1="106" y1="92" x2="306" y2="92"/><polygon points="314,92 304,87 304,97"/><text class="alc-label" x="210" y="84">POST /login, password</text></g>
<circle class="alc-dot alc-request alc-m1" cx="106" cy="92" r="5" style="--dx: 208px"/>
<g class="alc-step alc-request alc-s2"><line x1="326" y1="128" x2="526" y2="128"/><polygon points="534,128 524,123 524,133"/><text class="alc-label" x="430" y="120">new session: user 1</text></g>
<circle class="alc-dot alc-request alc-m2" cx="326" cy="128" r="5" style="--dx: 208px"/>
<g class="alc-step alc-reply alc-s3"><line x1="314" y1="164" x2="114" y2="164"/><polygon points="106,164 116,159 116,169"/><text class="alc-label" x="210" y="156">Set-Cookie: session=&lt;id&gt;</text></g>
<circle class="alc-dot alc-reply alc-m3" cx="314" cy="164" r="5" style="--dx: -208px"/>
<g class="alc-step alc-request alc-s4"><line x1="106" y1="200" x2="306" y2="200"/><polygon points="314,200 304,195 304,205"/><text class="alc-label" x="210" y="192">GET /me, Cookie: session</text></g>
<circle class="alc-dot alc-request alc-m4" cx="106" cy="200" r="5" style="--dx: 208px"/>
<g class="alc-step alc-request alc-s5"><line x1="326" y1="236" x2="526" y2="236"/><polygon points="534,236 524,231 524,241"/><text class="alc-label" x="430" y="228">load session &lt;id&gt;</text></g>
<circle class="alc-dot alc-request alc-m5" cx="326" cy="236" r="5" style="--dx: 208px"/>
<g class="alc-step alc-reply alc-s6"><line x1="534" y1="272" x2="334" y2="272"/><polygon points="326,272 336,267 336,277"/><text class="alc-label" x="430" y="264">user 1</text></g>
<circle class="alc-dot alc-reply alc-m6" cx="534" cy="272" r="5" style="--dx: -208px"/>
<g class="alc-step alc-reply alc-s7"><line x1="314" y1="308" x2="114" y2="308"/><polygon points="106,308 116,303 116,313"/><text class="alc-label" x="210" y="300">200 {&quot;login&quot;: &quot;octocat&quot;}</text></g>
<circle class="alc-dot alc-reply alc-m7" cx="314" cy="308" r="5" style="--dx: -208px"/>
<g class="alc-step alc-banner alc-s8"><rect x="20" y="338" width="600" height="34" rx="17"/><text x="320" y="360">The browser holds an id; the user stays on the server</text></g>
</svg>
<figcaption>What it&#x27;s for: a browser stays logged in after a login, holding only a random id; who the user is stays on the server.</figcaption>
</figure>

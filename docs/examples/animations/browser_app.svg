<figure class="alc-anim">
<svg viewBox="0 0 640 382" role="img" aria-labelledby="alc-browser_app-title alc-browser_app-desc" xmlns="http://www.w3.org/2000/svg">
<title id="alc-browser_app-title">A browser app</title>
<desc id="alc-browser_app-desc">Browser to Your app: GET /. Your app to Browser: page, CSRF token, CSP. Browser to Your app: POST /cart, X-CSRF-Token. Your app to Sessions: the cart, in the session. Your app to Browser: 303 → /. Browser to Your app: another site&#x27;s POST /logout. Your app to Browser: 403, cross-site. Sessions on the server; forms only from your own pages.</desc>
<line class="alc-life" x1="100" y1="52" x2="100" y2="330"/>
<g class="alc-actor"><rect x="18" y="10" width="164" height="42" rx="8"/><text x="100" y="36">Browser</text></g>
<line class="alc-life" x1="320" y1="52" x2="320" y2="330"/>
<g class="alc-actor"><rect x="238" y="10" width="164" height="42" rx="8"/><text x="320" y="36">Your app</text></g>
<line class="alc-life" x1="540" y1="52" x2="540" y2="330"/>
<g class="alc-actor"><rect x="458" y="10" width="164" height="42" rx="8"/><text x="540" y="36">Sessions</text></g>
<g class="alc-step alc-request alc-s1"><line x1="106" y1="92" x2="306" y2="92"/><polygon points="314,92 304,87 304,97"/><text class="alc-label" x="210" y="84">GET /</text></g>
<circle class="alc-dot alc-request alc-m1" cx="106" cy="92" r="5" style="--dx: 208px"/>
<g class="alc-step alc-reply alc-s2"><line x1="314" y1="128" x2="114" y2="128"/><polygon points="106,128 116,123 116,133"/><text class="alc-label" x="210" y="120">page, CSRF token, CSP</text></g>
<circle class="alc-dot alc-reply alc-m2" cx="314" cy="128" r="5" style="--dx: -208px"/>
<g class="alc-step alc-request alc-s3"><line x1="106" y1="164" x2="306" y2="164"/><polygon points="314,164 304,159 304,169"/><text class="alc-label" x="210" y="156">POST /cart, X-CSRF-Token</text></g>
<circle class="alc-dot alc-request alc-m3" cx="106" cy="164" r="5" style="--dx: 208px"/>
<g class="alc-step alc-request alc-s4"><line x1="326" y1="200" x2="526" y2="200"/><polygon points="534,200 524,195 524,205"/><text class="alc-label" x="430" y="192">the cart, in the session</text></g>
<circle class="alc-dot alc-request alc-m4" cx="326" cy="200" r="5" style="--dx: 208px"/>
<g class="alc-step alc-reply alc-s5"><line x1="314" y1="236" x2="114" y2="236"/><polygon points="106,236 116,231 116,241"/><text class="alc-label" x="210" y="228">303 → /</text></g>
<circle class="alc-dot alc-reply alc-m5" cx="314" cy="236" r="5" style="--dx: -208px"/>
<g class="alc-step alc-request alc-s6"><line x1="106" y1="272" x2="306" y2="272"/><polygon points="314,272 304,267 304,277"/><text class="alc-label" x="210" y="264">another site&#x27;s POST /logout</text></g>
<circle class="alc-dot alc-request alc-m6" cx="106" cy="272" r="5" style="--dx: 208px"/>
<g class="alc-step alc-refused alc-s7"><line x1="314" y1="308" x2="114" y2="308"/><polygon points="106,308 116,303 116,313"/><text class="alc-label" x="210" y="300">403, cross-site</text></g>
<circle class="alc-dot alc-refused alc-m7" cx="314" cy="308" r="5" style="--dx: -208px"/>
<g class="alc-step alc-banner alc-s8"><rect x="20" y="338" width="600" height="34" rx="17"/><text x="320" y="360">Sessions on the server; forms only from your own pages</text></g>
</svg>
<figcaption>What it&#x27;s for: a server-rendered app whose sessions live on the server, whose forms only its own pages can send, and whose pages carry the security headers.</figcaption>
</figure>

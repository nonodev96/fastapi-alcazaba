<figure class="alc-anim">
<svg viewBox="0 0 640 418" role="img" aria-labelledby="alc-background-title alc-background-desc" xmlns="http://www.w3.org/2000/svg">
<title id="alc-background-title">Background work</title>
<desc id="alc-background-desc">Client to Your app: POST /users. Your app to Worker: queue: welcome e-mail. Your app to Client: 201, at once. Worker: mailer down: retries. Worker: then a dead letter. Client to Your app: admin: requeue it. Your app to Worker: the task, again. Worker: ✓ e-mail sent. Work after the response: retried, kept, never lost.</desc>
<line class="alc-life" x1="100" y1="52" x2="100" y2="366"/>
<g class="alc-actor"><rect x="18" y="10" width="164" height="42" rx="8"/><text x="100" y="36">Client</text></g>
<line class="alc-life" x1="320" y1="52" x2="320" y2="366"/>
<g class="alc-actor"><rect x="238" y="10" width="164" height="42" rx="8"/><text x="320" y="36">Your app</text></g>
<line class="alc-life" x1="540" y1="52" x2="540" y2="366"/>
<g class="alc-actor"><rect x="458" y="10" width="164" height="42" rx="8"/><text x="540" y="36">Worker</text></g>
<g class="alc-step alc-request alc-s1"><line x1="106" y1="92" x2="306" y2="92"/><polygon points="314,92 304,87 304,97"/><text class="alc-label" x="210" y="84">POST /users</text></g>
<circle class="alc-dot alc-request alc-m1" cx="106" cy="92" r="5" style="--dx: 208px"/>
<g class="alc-step alc-request alc-s2"><line x1="326" y1="128" x2="526" y2="128"/><polygon points="534,128 524,123 524,133"/><text class="alc-label" x="430" y="120">queue: welcome e-mail</text></g>
<circle class="alc-dot alc-request alc-m2" cx="326" cy="128" r="5" style="--dx: 208px"/>
<g class="alc-step alc-reply alc-s3"><line x1="314" y1="164" x2="114" y2="164"/><polygon points="106,164 116,159 116,169"/><text class="alc-label" x="210" y="156">201, at once</text></g>
<circle class="alc-dot alc-reply alc-m3" cx="314" cy="164" r="5" style="--dx: -208px"/>
<g class="alc-step alc-note alc-s4 alc-refused"><rect x="451" y="186" width="178" height="26" rx="13"/><text class="alc-label" x="540" y="204">mailer down: retries</text></g>
<g class="alc-step alc-note alc-s5 alc-refused"><rect x="459" y="222" width="163" height="26" rx="13"/><text class="alc-label" x="540" y="240">then a dead letter</text></g>
<g class="alc-step alc-request alc-s6"><line x1="106" y1="272" x2="306" y2="272"/><polygon points="314,272 304,267 304,277"/><text class="alc-label" x="210" y="264">admin: requeue it</text></g>
<circle class="alc-dot alc-request alc-m6" cx="106" cy="272" r="5" style="--dx: 208px"/>
<g class="alc-step alc-request alc-s7"><line x1="326" y1="308" x2="526" y2="308"/><polygon points="534,308 524,303 524,313"/><text class="alc-label" x="430" y="300">the task, again</text></g>
<circle class="alc-dot alc-request alc-m7" cx="326" cy="308" r="5" style="--dx: 208px"/>
<g class="alc-step alc-note alc-s8"><rect x="478" y="330" width="125" height="26" rx="13"/><text class="alc-label" x="540" y="348">✓ e-mail sent</text></g>
<g class="alc-step alc-banner alc-s9"><rect x="20" y="374" width="600" height="34" rx="17"/><text x="320" y="396">Work after the response: retried, kept, never lost</text></g>
</svg>
<figcaption>What it&#x27;s for: work that goes on after the response (e-mails, reports, relays), run in one of the processes, retried while it fails, and kept when it can&#x27;t be done.</figcaption>
</figure>

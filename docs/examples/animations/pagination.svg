<figure class="alc-anim">
<svg viewBox="0 0 640 382" role="img" aria-labelledby="alc-pagination-title alc-pagination-desc" xmlns="http://www.w3.org/2000/svg">
<title id="alc-pagination-title">Pagination</title>
<desc id="alc-pagination-desc">Client to Your app: GET ?page=2&amp;page_size=3. Your app to Cache: page 2: its own entry. Your app to Client: 200, 3 items, Link: next. Client to Your app: GET ?page_size=1000. Your app to Client: 422, page_size ≤ 100. Client to Your app: GET …/newest?cursor=NTk… Your app to Client: 200, the 2 after it. Pages checked, linked, and cached each under its own key.</desc>
<line class="alc-life" x1="100" y1="52" x2="100" y2="330"/>
<g class="alc-actor"><rect x="18" y="10" width="164" height="42" rx="8"/><text x="100" y="36">Client</text></g>
<line class="alc-life" x1="320" y1="52" x2="320" y2="330"/>
<g class="alc-actor"><rect x="238" y="10" width="164" height="42" rx="8"/><text x="320" y="36">Your app</text></g>
<line class="alc-life" x1="540" y1="52" x2="540" y2="330"/>
<g class="alc-actor"><rect x="458" y="10" width="164" height="42" rx="8"/><text x="540" y="36">Cache</text></g>
<g class="alc-step alc-request alc-s1"><line x1="106" y1="92" x2="306" y2="92"/><polygon points="314,92 304,87 304,97"/><text class="alc-label" x="210" y="84">GET ?page=2&amp;page_size=3</text></g>
<circle class="alc-dot alc-request alc-m1" cx="106" cy="92" r="5" style="--dx: 208px"/>
<g class="alc-step alc-request alc-s2"><line x1="326" y1="128" x2="526" y2="128"/><polygon points="534,128 524,123 524,133"/><text class="alc-label" x="430" y="120">page 2: its own entry</text></g>
<circle class="alc-dot alc-request alc-m2" cx="326" cy="128" r="5" style="--dx: 208px"/>
<g class="alc-step alc-reply alc-s3"><line x1="314" y1="164" x2="114" y2="164"/><polygon points="106,164 116,159 116,169"/><text class="alc-label" x="210" y="156">200, 3 items, Link: next</text></g>
<circle class="alc-dot alc-reply alc-m3" cx="314" cy="164" r="5" style="--dx: -208px"/>
<g class="alc-step alc-request alc-s4"><line x1="106" y1="200" x2="306" y2="200"/><polygon points="314,200 304,195 304,205"/><text class="alc-label" x="210" y="192">GET ?page_size=1000</text></g>
<circle class="alc-dot alc-request alc-m4" cx="106" cy="200" r="5" style="--dx: 208px"/>
<g class="alc-step alc-refused alc-s5"><line x1="314" y1="236" x2="114" y2="236"/><polygon points="106,236 116,231 116,241"/><text class="alc-label" x="210" y="228">422, page_size ≤ 100</text></g>
<circle class="alc-dot alc-refused alc-m5" cx="314" cy="236" r="5" style="--dx: -208px"/>
<g class="alc-step alc-request alc-s6"><line x1="106" y1="272" x2="306" y2="272"/><polygon points="314,272 304,267 304,277"/><text class="alc-label" x="210" y="264">GET …/newest?cursor=NTk…</text></g>
<circle class="alc-dot alc-request alc-m6" cx="106" cy="272" r="5" style="--dx: 208px"/>
<g class="alc-step alc-reply alc-s7"><line x1="314" y1="308" x2="114" y2="308"/><polygon points="106,308 116,303 116,313"/><text class="alc-label" x="210" y="300">200, the 2 after it</text></g>
<circle class="alc-dot alc-reply alc-m7" cx="314" cy="308" r="5" style="--dx: -208px"/>
<g class="alc-step alc-banner alc-s8"><rect x="20" y="338" width="600" height="34" rx="17"/><text x="320" y="360">Pages checked, linked, and cached each under its own key</text></g>
</svg>
<figcaption>What it&#x27;s for: lists served a page at a time, by page number or by cursor, with limits that clients can&#x27;t go past, and each page cached apart.</figcaption>
</figure>

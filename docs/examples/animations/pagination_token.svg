<figure class="alc-anim">
<svg viewBox="0 0 640 418" role="img" aria-labelledby="alc-pagination_token-title alc-pagination_token-desc" xmlns="http://www.w3.org/2000/svg">
<title id="alc-pagination_token-title">PaginationToken</title>
<desc id="alc-pagination_token-desc">Client to Your app: GET /books?genre=poetry. Your app to Database: LIMIT 5 OFFSET 0. Your app to Client: 4 books, next_page_token. Client to Your app: …&amp;page_token=WzQs… Your app: ✓ signature, query, age. Your app to Client: the next 4 books. Client to Your app: genre=novel, the same token. Your app to Client: 400: other query parameters. The token leads to the next page of its own query, and nowhere else.</desc>
<line class="alc-life" x1="100" y1="52" x2="100" y2="366"/>
<g class="alc-actor"><rect x="18" y="10" width="164" height="42" rx="8"/><text x="100" y="36">Client</text></g>
<line class="alc-life" x1="320" y1="52" x2="320" y2="366"/>
<g class="alc-actor"><rect x="238" y="10" width="164" height="42" rx="8"/><text x="320" y="36">Your app</text></g>
<line class="alc-life" x1="540" y1="52" x2="540" y2="366"/>
<g class="alc-actor"><rect x="458" y="10" width="164" height="42" rx="8"/><text x="540" y="36">Database</text></g>
<g class="alc-step alc-request alc-s1"><line x1="106" y1="92" x2="306" y2="92"/><polygon points="314,92 304,87 304,97"/><text class="alc-label" x="210" y="84">GET /books?genre=poetry</text></g>
<circle class="alc-dot alc-request alc-m1" cx="106" cy="92" r="5" style="--dx: 208px"/>
<g class="alc-step alc-request alc-s2"><line x1="326" y1="128" x2="526" y2="128"/><polygon points="534,128 524,123 524,133"/><text class="alc-label" x="430" y="120">LIMIT 5 OFFSET 0</text></g>
<circle class="alc-dot alc-request alc-m2" cx="326" cy="128" r="5" style="--dx: 208px"/>
<g class="alc-step alc-reply alc-s3"><line x1="314" y1="164" x2="114" y2="164"/><polygon points="106,164 116,159 116,169"/><text class="alc-label" x="210" y="156">4 books, next_page_token</text></g>
<circle class="alc-dot alc-reply alc-m3" cx="314" cy="164" r="5" style="--dx: -208px"/>
<g class="alc-step alc-request alc-s4"><line x1="106" y1="200" x2="306" y2="200"/><polygon points="314,200 304,195 304,205"/><text class="alc-label" x="210" y="192">…&amp;page_token=WzQs…</text></g>
<circle class="alc-dot alc-request alc-m4" cx="106" cy="200" r="5" style="--dx: 208px"/>
<g class="alc-step alc-note alc-s5"><rect x="220" y="222" width="201" height="26" rx="13"/><text class="alc-label" x="320" y="240">✓ signature, query, age</text></g>
<g class="alc-step alc-reply alc-s6"><line x1="314" y1="272" x2="114" y2="272"/><polygon points="106,272 116,267 116,277"/><text class="alc-label" x="210" y="264">the next 4 books</text></g>
<circle class="alc-dot alc-reply alc-m6" cx="314" cy="272" r="5" style="--dx: -208px"/>
<g class="alc-step alc-request alc-s7"><line x1="106" y1="308" x2="306" y2="308"/><polygon points="314,308 304,303 304,313"/><text class="alc-label" x="210" y="300">genre=novel, the same token</text></g>
<circle class="alc-dot alc-request alc-m7" cx="106" cy="308" r="5" style="--dx: 208px"/>
<g class="alc-step alc-refused alc-s8"><line x1="314" y1="344" x2="114" y2="344"/><polygon points="106,344 116,339 116,349"/><text class="alc-label" x="210" y="336">400: other query parameters</text></g>
<circle class="alc-dot alc-refused alc-m8" cx="314" cy="344" r="5" style="--dx: -208px"/>
<g class="alc-step alc-banner alc-s9"><rect x="20" y="374" width="600" height="34" rx="17"/><text x="320" y="396">The token leads to the next page of its own query, and nowhere else</text></g>
</svg>
<figcaption>What it&#x27;s for: a page at a time, where clients only send back the token the last page gave them: signed, bound to the query, and short-lived.</figcaption>
</figure>

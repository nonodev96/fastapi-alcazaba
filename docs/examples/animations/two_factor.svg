<figure class="alc-anim">
<svg viewBox="0 0 640 418" role="img" aria-labelledby="alc-two_factor-title alc-two_factor-desc" xmlns="http://www.w3.org/2000/svg">
<title id="alc-two_factor-title">Second factor</title>
<desc id="alc-two_factor-desc">User to Your app: password: ana. Your app to User: next: the app&#x27;s code. User to Your app: code 013263. Your app to Codes used: used already? Codes used to Your app: no: now it is. Your app to User: logged in, mfa now. User to Your app: the same code, elsewhere. Your app to User: 401 Wrong code. A code of the app, after the password: each one once.</desc>
<line class="alc-life" x1="100" y1="52" x2="100" y2="366"/>
<g class="alc-actor"><rect x="18" y="10" width="164" height="42" rx="8"/><text x="100" y="36">User</text></g>
<line class="alc-life" x1="320" y1="52" x2="320" y2="366"/>
<g class="alc-actor"><rect x="238" y="10" width="164" height="42" rx="8"/><text x="320" y="36">Your app</text></g>
<line class="alc-life" x1="540" y1="52" x2="540" y2="366"/>
<g class="alc-actor"><rect x="458" y="10" width="164" height="42" rx="8"/><text x="540" y="36">Codes used</text></g>
<g class="alc-step alc-request alc-s1"><line x1="106" y1="92" x2="306" y2="92"/><polygon points="314,92 304,87 304,97"/><text class="alc-label" x="210" y="84">password: ana</text></g>
<circle class="alc-dot alc-request alc-m1" cx="106" cy="92" r="5" style="--dx: 208px"/>
<g class="alc-step alc-reply alc-s2"><line x1="314" y1="128" x2="114" y2="128"/><polygon points="106,128 116,123 116,133"/><text class="alc-label" x="210" y="120">next: the app&#x27;s code</text></g>
<circle class="alc-dot alc-reply alc-m2" cx="314" cy="128" r="5" style="--dx: -208px"/>
<g class="alc-step alc-request alc-s3"><line x1="106" y1="164" x2="306" y2="164"/><polygon points="314,164 304,159 304,169"/><text class="alc-label" x="210" y="156">code 013263</text></g>
<circle class="alc-dot alc-request alc-m3" cx="106" cy="164" r="5" style="--dx: 208px"/>
<g class="alc-step alc-request alc-s4"><line x1="326" y1="200" x2="526" y2="200"/><polygon points="534,200 524,195 524,205"/><text class="alc-label" x="430" y="192">used already?</text></g>
<circle class="alc-dot alc-request alc-m4" cx="326" cy="200" r="5" style="--dx: 208px"/>
<g class="alc-step alc-reply alc-s5"><line x1="534" y1="236" x2="334" y2="236"/><polygon points="326,236 336,231 336,241"/><text class="alc-label" x="430" y="228">no: now it is</text></g>
<circle class="alc-dot alc-reply alc-m5" cx="534" cy="236" r="5" style="--dx: -208px"/>
<g class="alc-step alc-reply alc-s6"><line x1="314" y1="272" x2="114" y2="272"/><polygon points="106,272 116,267 116,277"/><text class="alc-label" x="210" y="264">logged in, mfa now</text></g>
<circle class="alc-dot alc-reply alc-m6" cx="314" cy="272" r="5" style="--dx: -208px"/>
<g class="alc-step alc-request alc-s7"><line x1="106" y1="308" x2="306" y2="308"/><polygon points="314,308 304,303 304,313"/><text class="alc-label" x="210" y="300">the same code, elsewhere</text></g>
<circle class="alc-dot alc-request alc-m7" cx="106" cy="308" r="5" style="--dx: 208px"/>
<g class="alc-step alc-refused alc-s8"><line x1="314" y1="344" x2="114" y2="344"/><polygon points="106,344 116,339 116,349"/><text class="alc-label" x="210" y="336">401 Wrong code</text></g>
<circle class="alc-dot alc-refused alc-m8" cx="314" cy="344" r="5" style="--dx: -208px"/>
<g class="alc-step alc-banner alc-s9"><rect x="20" y="374" width="600" height="34" rx="17"/><text x="320" y="396">A code of the app, after the password: each one once</text></g>
</svg>
<figcaption>What it&#x27;s for: a code of the user&#x27;s authenticator app after the password, each code once, and a recent one for what can&#x27;t be undone.</figcaption>
</figure>

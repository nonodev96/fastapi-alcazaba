<figure class="alc-anim">
<svg viewBox="0 0 640 346" role="img" aria-labelledby="alc-auth_strategies-title alc-auth_strategies-desc" xmlns="http://www.w3.org/2000/svg">
<title id="alc-auth_strategies-title">One route, several strategies</title>
<desc id="alc-auth_strategies-desc">Browser to Your app: GET /me, Cookie: session. Your app: &quot;session&quot; ✓. Your app to Browser: 200 octocat. Script to Your app: GET /me, Bearer eyJ… Your app: &quot;session&quot; ✗ → &quot;jwt&quot; ✓. Your app to Script: 200 octocat. auth.authenticate(&quot;session&quot;, &quot;jwt&quot;): the first that finds the user.</desc>
<line class="alc-life" x1="100" y1="52" x2="100" y2="294"/>
<g class="alc-actor"><rect x="18" y="10" width="164" height="42" rx="8"/><text x="100" y="36">Browser</text></g>
<line class="alc-life" x1="320" y1="52" x2="320" y2="294"/>
<g class="alc-actor"><rect x="238" y="10" width="164" height="42" rx="8"/><text x="320" y="36">Your app</text></g>
<line class="alc-life" x1="540" y1="52" x2="540" y2="294"/>
<g class="alc-actor"><rect x="458" y="10" width="164" height="42" rx="8"/><text x="540" y="36">Script</text></g>
<g class="alc-step alc-request alc-s1"><line x1="106" y1="92" x2="306" y2="92"/><polygon points="314,92 304,87 304,97"/><text class="alc-label" x="210" y="84">GET /me, Cookie: session</text></g>
<circle class="alc-dot alc-request alc-m1" cx="106" cy="92" r="5" style="--dx: 208px"/>
<g class="alc-step alc-note alc-s2"><rect x="265" y="114" width="110" height="26" rx="13"/><text class="alc-label" x="320" y="132">&quot;session&quot; ✓</text></g>
<g class="alc-step alc-reply alc-s3"><line x1="314" y1="164" x2="114" y2="164"/><polygon points="106,164 116,159 116,169"/><text class="alc-label" x="210" y="156">200 octocat</text></g>
<circle class="alc-dot alc-reply alc-m3" cx="314" cy="164" r="5" style="--dx: -208px"/>
<g class="alc-step alc-request alc-s4"><line x1="534" y1="200" x2="334" y2="200"/><polygon points="326,200 336,195 336,205"/><text class="alc-label" x="430" y="192">GET /me, Bearer eyJ…</text></g>
<circle class="alc-dot alc-request alc-m4" cx="534" cy="200" r="5" style="--dx: -208px"/>
<g class="alc-step alc-note alc-s5"><rect x="227" y="222" width="186" height="26" rx="13"/><text class="alc-label" x="320" y="240">&quot;session&quot; ✗ → &quot;jwt&quot; ✓</text></g>
<g class="alc-step alc-reply alc-s6"><line x1="326" y1="272" x2="526" y2="272"/><polygon points="534,272 524,267 524,277"/><text class="alc-label" x="430" y="264">200 octocat</text></g>
<circle class="alc-dot alc-reply alc-m6" cx="326" cy="272" r="5" style="--dx: 208px"/>
<g class="alc-step alc-banner alc-s7"><rect x="20" y="302" width="600" height="34" rx="17"/><text x="320" y="324">auth.authenticate(&quot;session&quot;, &quot;jwt&quot;): the first that finds the user</text></g>
</svg>
<figcaption>What it&#x27;s for: one route that browsers reach with their session and scripts with a token, each strategy tried in order.</figcaption>
</figure>

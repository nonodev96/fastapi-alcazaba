<figure class="alc-anim">
<svg viewBox="0 0 640 382" role="img" aria-labelledby="alc-auth_your_own-title alc-auth_your_own-desc" xmlns="http://www.w3.org/2000/svg">
<title id="alc-auth_your_own-title">Your own strategy</title>
<desc id="alc-auth_your_own-desc">Program to Your app: GET /me, X-API-Key: demo_… Your app: APIKeyStrategy.authenticate(). Your app to API keys: key id → digest, owner. API keys to Your app: owner: user 1. Your app to Program: 200 {&quot;login&quot;: &quot;octocat&quot;}. Program to Your app: GET /me, a wrong key. Your app to Program: 401, APIKey challenge. Return the user, None, or raise AuthenticationFailed.</desc>
<line class="alc-life" x1="100" y1="52" x2="100" y2="330"/>
<g class="alc-actor"><rect x="18" y="10" width="164" height="42" rx="8"/><text x="100" y="36">Program</text></g>
<line class="alc-life" x1="320" y1="52" x2="320" y2="330"/>
<g class="alc-actor"><rect x="238" y="10" width="164" height="42" rx="8"/><text x="320" y="36">Your app</text></g>
<line class="alc-life" x1="540" y1="52" x2="540" y2="330"/>
<g class="alc-actor"><rect x="458" y="10" width="164" height="42" rx="8"/><text x="540" y="36">API keys</text></g>
<g class="alc-step alc-request alc-s1"><line x1="106" y1="92" x2="306" y2="92"/><polygon points="314,92 304,87 304,97"/><text class="alc-label" x="210" y="84">GET /me, X-API-Key: demo_…</text></g>
<circle class="alc-dot alc-request alc-m1" cx="106" cy="92" r="5" style="--dx: 208px"/>
<g class="alc-step alc-note alc-s2"><rect x="197" y="114" width="246" height="26" rx="13"/><text class="alc-label" x="320" y="132">APIKeyStrategy.authenticate()</text></g>
<g class="alc-step alc-request alc-s3"><line x1="326" y1="164" x2="526" y2="164"/><polygon points="534,164 524,159 524,169"/><text class="alc-label" x="430" y="156">key id → digest, owner</text></g>
<circle class="alc-dot alc-request alc-m3" cx="326" cy="164" r="5" style="--dx: 208px"/>
<g class="alc-step alc-reply alc-s4"><line x1="534" y1="200" x2="334" y2="200"/><polygon points="326,200 336,195 336,205"/><text class="alc-label" x="430" y="192">owner: user 1</text></g>
<circle class="alc-dot alc-reply alc-m4" cx="534" cy="200" r="5" style="--dx: -208px"/>
<g class="alc-step alc-reply alc-s5"><line x1="314" y1="236" x2="114" y2="236"/><polygon points="106,236 116,231 116,241"/><text class="alc-label" x="210" y="228">200 {&quot;login&quot;: &quot;octocat&quot;}</text></g>
<circle class="alc-dot alc-reply alc-m5" cx="314" cy="236" r="5" style="--dx: -208px"/>
<g class="alc-step alc-request alc-s6"><line x1="106" y1="272" x2="306" y2="272"/><polygon points="314,272 304,267 304,277"/><text class="alc-label" x="210" y="264">GET /me, a wrong key</text></g>
<circle class="alc-dot alc-request alc-m6" cx="106" cy="272" r="5" style="--dx: 208px"/>
<g class="alc-step alc-refused alc-s7"><line x1="314" y1="308" x2="114" y2="308"/><polygon points="106,308 116,303 116,313"/><text class="alc-label" x="210" y="300">401, APIKey challenge</text></g>
<circle class="alc-dot alc-refused alc-m7" cx="314" cy="308" r="5" style="--dx: -208px"/>
<g class="alc-step alc-banner alc-s8"><rect x="20" y="338" width="600" height="34" rx="17"/><text x="320" y="360">Return the user, None, or raise AuthenticationFailed</text></g>
</svg>
<figcaption>What it&#x27;s for: any other credential (an API key, a client certificate, a signed request): you write authenticate(), FastAPIAuth does the rest.</figcaption>
</figure>

<figure class="alc-anim">
<svg viewBox="0 0 640 382" role="img" aria-labelledby="alc-pagination_time_based-title alc-pagination_time_based-desc" xmlns="http://www.w3.org/2000/svg">
<title id="alc-pagination_time_based-title">PaginationTimeBased</title>
<desc id="alc-pagination_time_based-desc">Client to Your app: GET /posts?timestamp=10:00Z. Your app to Database: &lt; 10:00 DESC, LIMIT 4. Database to Your app: 09:30, then 3 at 09:00. Your app: 09:00 goes on: left for later. Your app to Client: 200, 1 post, next: 09:30. Client to Your app: GET ?timestamp=09:30Z. Your app to Client: 200, the three of 09:00. No item skipped, however many share a time.</desc>
<line class="alc-life" x1="100" y1="52" x2="100" y2="330"/>
<g class="alc-actor"><rect x="18" y="10" width="164" height="42" rx="8"/><text x="100" y="36">Client</text></g>
<line class="alc-life" x1="320" y1="52" x2="320" y2="330"/>
<g class="alc-actor"><rect x="238" y="10" width="164" height="42" rx="8"/><text x="320" y="36">Your app</text></g>
<line class="alc-life" x1="540" y1="52" x2="540" y2="330"/>
<g class="alc-actor"><rect x="458" y="10" width="164" height="42" rx="8"/><text x="540" y="36">Database</text></g>
<g class="alc-step alc-request alc-s1"><line x1="106" y1="92" x2="306" y2="92"/><polygon points="314,92 304,87 304,97"/><text class="alc-label" x="210" y="84">GET /posts?timestamp=10:00Z</text></g>
<circle class="alc-dot alc-request alc-m1" cx="106" cy="92" r="5" style="--dx: 208px"/>
<g class="alc-step alc-request alc-s2"><line x1="326" y1="128" x2="526" y2="128"/><polygon points="534,128 524,123 524,133"/><text class="alc-label" x="430" y="120">&lt; 10:00 DESC, LIMIT 4</text></g>
<circle class="alc-dot alc-request alc-m2" cx="326" cy="128" r="5" style="--dx: 208px"/>
<g class="alc-step alc-reply alc-s3"><line x1="534" y1="164" x2="334" y2="164"/><polygon points="326,164 336,159 336,169"/><text class="alc-label" x="430" y="156">09:30, then 3 at 09:00</text></g>
<circle class="alc-dot alc-reply alc-m3" cx="534" cy="164" r="5" style="--dx: -208px"/>
<g class="alc-step alc-note alc-s4"><rect x="197" y="186" width="246" height="26" rx="13"/><text class="alc-label" x="320" y="204">09:00 goes on: left for later</text></g>
<g class="alc-step alc-reply alc-s5"><line x1="314" y1="236" x2="114" y2="236"/><polygon points="106,236 116,231 116,241"/><text class="alc-label" x="210" y="228">200, 1 post, next: 09:30</text></g>
<circle class="alc-dot alc-reply alc-m5" cx="314" cy="236" r="5" style="--dx: -208px"/>
<g class="alc-step alc-request alc-s6"><line x1="106" y1="272" x2="306" y2="272"/><polygon points="314,272 304,267 304,277"/><text class="alc-label" x="210" y="264">GET ?timestamp=09:30Z</text></g>
<circle class="alc-dot alc-request alc-m6" cx="106" cy="272" r="5" style="--dx: 208px"/>
<g class="alc-step alc-reply alc-s7"><line x1="314" y1="308" x2="114" y2="308"/><polygon points="106,308 116,303 116,313"/><text class="alc-label" x="210" y="300">200, the three of 09:00</text></g>
<circle class="alc-dot alc-reply alc-m7" cx="314" cy="308" r="5" style="--dx: -208px"/>
<g class="alc-step alc-banner alc-s8"><rect x="20" y="338" width="600" height="34" rx="17"/><text x="320" y="360">No item skipped, however many share a time</text></g>
</svg>
<figcaption>What it&#x27;s for: feeds and syncing by time, with pages that never split the items that share a time.</figcaption>
</figure>

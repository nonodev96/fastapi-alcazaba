<figure class="alc-anim">
<svg viewBox="0 0 640 418" role="img" aria-labelledby="alc-auth_oidc-title alc-auth_oidc-desc" xmlns="http://www.w3.org/2000/svg">
<title id="alc-auth_oidc-title">OIDCStrategy</title>
<desc id="alc-auth_oidc-desc">Browser to Your app: GET /login. Your app to Browser: 302, state, PKCE, nonce. Browser to Provider: log in at the provider. Provider to Browser: 302 → callback ?code=… Browser to Your app: GET /auth/callback. Your app to Provider: code + verifier → ID token. Your app: signature, iss, aud, nonce ✓. Your app to Browser: session cookie, 303 /me. The ID token verified: from the provider, for this app, this login.</desc>
<line class="alc-life" x1="100" y1="52" x2="100" y2="366"/>
<g class="alc-actor"><rect x="18" y="10" width="164" height="42" rx="8"/><text x="100" y="36">Browser</text></g>
<line class="alc-life" x1="320" y1="52" x2="320" y2="366"/>
<g class="alc-actor"><rect x="238" y="10" width="164" height="42" rx="8"/><text x="320" y="36">Your app</text></g>
<line class="alc-life" x1="540" y1="52" x2="540" y2="366"/>
<g class="alc-actor"><rect x="458" y="10" width="164" height="42" rx="8"/><text x="540" y="36">Provider</text></g>
<g class="alc-step alc-request alc-s1"><line x1="106" y1="92" x2="306" y2="92"/><polygon points="314,92 304,87 304,97"/><text class="alc-label" x="210" y="84">GET /login</text></g>
<circle class="alc-dot alc-request alc-m1" cx="106" cy="92" r="5" style="--dx: 208px"/>
<g class="alc-step alc-reply alc-s2"><line x1="314" y1="128" x2="114" y2="128"/><polygon points="106,128 116,123 116,133"/><text class="alc-label" x="210" y="120">302, state, PKCE, nonce</text></g>
<circle class="alc-dot alc-reply alc-m2" cx="314" cy="128" r="5" style="--dx: -208px"/>
<g class="alc-step alc-request alc-s3"><line x1="106" y1="164" x2="526" y2="164"/><polygon points="534,164 524,159 524,169"/><text class="alc-label" x="320" y="156">log in at the provider</text></g>
<circle class="alc-dot alc-request alc-m3" cx="106" cy="164" r="5" style="--dx: 428px"/>
<g class="alc-step alc-reply alc-s4"><line x1="534" y1="200" x2="114" y2="200"/><polygon points="106,200 116,195 116,205"/><text class="alc-label" x="320" y="192">302 → callback ?code=…</text></g>
<circle class="alc-dot alc-reply alc-m4" cx="534" cy="200" r="5" style="--dx: -428px"/>
<g class="alc-step alc-request alc-s5"><line x1="106" y1="236" x2="306" y2="236"/><polygon points="314,236 304,231 304,241"/><text class="alc-label" x="210" y="228">GET /auth/callback</text></g>
<circle class="alc-dot alc-request alc-m5" cx="106" cy="236" r="5" style="--dx: 208px"/>
<g class="alc-step alc-request alc-s6"><line x1="326" y1="272" x2="526" y2="272"/><polygon points="534,272 524,267 524,277"/><text class="alc-label" x="430" y="264">code + verifier → ID token</text></g>
<circle class="alc-dot alc-request alc-m6" cx="326" cy="272" r="5" style="--dx: 208px"/>
<g class="alc-step alc-note alc-s7"><rect x="201" y="294" width="239" height="26" rx="13"/><text class="alc-label" x="320" y="312">signature, iss, aud, nonce ✓</text></g>
<g class="alc-step alc-reply alc-s8"><line x1="314" y1="344" x2="114" y2="344"/><polygon points="106,344 116,339 116,349"/><text class="alc-label" x="210" y="336">session cookie, 303 /me</text></g>
<circle class="alc-dot alc-reply alc-m8" cx="314" cy="344" r="5" style="--dx: -208px"/>
<g class="alc-step alc-banner alc-s9"><rect x="20" y="374" width="600" height="34" rx="17"/><text x="320" y="396">The ID token verified: from the provider, for this app, this login</text></g>
</svg>
<figcaption>What it&#x27;s for: logins with an OpenID Connect provider (Keycloak, Google, Entra ID…), whose ID token is verified before your code trusts its claims.</figcaption>
</figure>

<figure class="alc-anim">
<svg viewBox="0 0 640 382" role="img" aria-labelledby="alc-countries-title alc-countries-desc" xmlns="http://www.w3.org/2000/svg">
<title id="alc-countries-title">Countries and Spain</title>
<desc id="alc-countries-desc">Client to Your app: POST /customers, ES, b-12345674. Your app: ✓ a CIF, its control digit right. Your app: ✓ 18001: Granada, Andalucía. Your app to Client: 201, B12345674. Client to Your app: the NIF 12345678A. Your app: ✗ the DNI&#x27;s letter is Z. Your app to Client: 422 Unprocessable. ISO 3166-1 codes; NIFs and provinces checked, normalized.</desc>
<line class="alc-life" x1="150" y1="52" x2="150" y2="330"/>
<g class="alc-actor"><rect x="68" y="10" width="164" height="42" rx="8"/><text x="150" y="36">Client</text></g>
<line class="alc-life" x1="490" y1="52" x2="490" y2="330"/>
<g class="alc-actor"><rect x="408" y="10" width="164" height="42" rx="8"/><text x="490" y="36">Your app</text></g>
<g class="alc-step alc-request alc-s1"><line x1="156" y1="92" x2="476" y2="92"/><polygon points="484,92 474,87 474,97"/><text class="alc-label" x="320" y="84">POST /customers, ES, b-12345674</text></g>
<circle class="alc-dot alc-request alc-m1" cx="156" cy="92" r="5" style="--dx: 328px"/>
<g class="alc-step alc-note alc-s2"><rect x="356" y="114" width="269" height="26" rx="13"/><text class="alc-label" x="490" y="132">✓ a CIF, its control digit right</text></g>
<g class="alc-step alc-note alc-s3"><rect x="375" y="150" width="231" height="26" rx="13"/><text class="alc-label" x="490" y="168">✓ 18001: Granada, Andalucía</text></g>
<g class="alc-step alc-reply alc-s4"><line x1="484" y1="200" x2="164" y2="200"/><polygon points="156,200 166,195 166,205"/><text class="alc-label" x="320" y="192">201, B12345674</text></g>
<circle class="alc-dot alc-reply alc-m4" cx="484" cy="200" r="5" style="--dx: -328px"/>
<g class="alc-step alc-request alc-s5"><line x1="156" y1="236" x2="476" y2="236"/><polygon points="484,236 474,231 474,241"/><text class="alc-label" x="320" y="228">the NIF 12345678A</text></g>
<circle class="alc-dot alc-request alc-m5" cx="156" cy="236" r="5" style="--dx: 328px"/>
<g class="alc-step alc-note alc-s6 alc-refused"><rect x="390" y="258" width="201" height="26" rx="13"/><text class="alc-label" x="490" y="276">✗ the DNI&#x27;s letter is Z</text></g>
<g class="alc-step alc-refused alc-s7"><line x1="484" y1="308" x2="164" y2="308"/><polygon points="156,308 166,303 166,313"/><text class="alc-label" x="320" y="300">422 Unprocessable</text></g>
<circle class="alc-dot alc-refused alc-m7" cx="484" cy="308" r="5" style="--dx: -328px"/>
<g class="alc-step alc-banner alc-s8"><rect x="20" y="338" width="600" height="34" rx="17"/><text x="320" y="360">ISO 3166-1 codes; NIFs and provinces checked, normalized</text></g>
</svg>
<figcaption>What it&#x27;s for: country codes that are ISO&#x27;s, and Spanish NIFs and postal codes checked by their rules, before the app stores a customer.</figcaption>

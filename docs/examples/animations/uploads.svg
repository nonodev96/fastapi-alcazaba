<figure class="alc-anim">
<svg viewBox="0 0 640 382" role="img" aria-labelledby="alc-uploads-title alc-uploads-desc" xmlns="http://www.w3.org/2000/svg">
<title id="alc-uploads-title">Checking uploads</title>
<desc id="alc-uploads-desc">User to Your app: POST /avatars, cat.png. Your app: ✓ a PNG, by its bytes. Your app to Storage: stored as &lt;uuid&gt;.png. Your app to User: 201 Created. User to Your app: cat.html, named cat.png. Your app: ✗ HTML, whatever its name. Your app to User: 415 Unsupported Media Type. Judged by their bytes, stored under names of the app&#x27;s own.</desc>
<line class="alc-life" x1="100" y1="52" x2="100" y2="330"/>
<g class="alc-actor"><rect x="18" y="10" width="164" height="42" rx="8"/><text x="100" y="36">User</text></g>
<line class="alc-life" x1="320" y1="52" x2="320" y2="330"/>
<g class="alc-actor"><rect x="238" y="10" width="164" height="42" rx="8"/><text x="320" y="36">Your app</text></g>
<line class="alc-life" x1="540" y1="52" x2="540" y2="330"/>
<g class="alc-actor"><rect x="458" y="10" width="164" height="42" rx="8"/><text x="540" y="36">Storage</text></g>
<g class="alc-step alc-request alc-s1"><line x1="106" y1="92" x2="306" y2="92"/><polygon points="314,92 304,87 304,97"/><text class="alc-label" x="210" y="84">POST /avatars, cat.png</text></g>
<circle class="alc-dot alc-request alc-m1" cx="106" cy="92" r="5" style="--dx: 208px"/>
<g class="alc-step alc-note alc-s2"><rect x="227" y="114" width="186" height="26" rx="13"/><text class="alc-label" x="320" y="132">✓ a PNG, by its bytes</text></g>
<g class="alc-step alc-request alc-s3"><line x1="326" y1="164" x2="526" y2="164"/><polygon points="534,164 524,159 524,169"/><text class="alc-label" x="430" y="156">stored as &lt;uuid&gt;.png</text></g>
<circle class="alc-dot alc-request alc-m3" cx="326" cy="164" r="5" style="--dx: 208px"/>
<g class="alc-step alc-reply alc-s4"><line x1="314" y1="200" x2="114" y2="200"/><polygon points="106,200 116,195 116,205"/><text class="alc-label" x="210" y="192">201 Created</text></g>
<circle class="alc-dot alc-reply alc-m4" cx="314" cy="200" r="5" style="--dx: -208px"/>
<g class="alc-step alc-request alc-s5"><line x1="106" y1="236" x2="306" y2="236"/><polygon points="314,236 304,231 304,241"/><text class="alc-label" x="210" y="228">cat.html, named cat.png</text></g>
<circle class="alc-dot alc-request alc-m5" cx="106" cy="236" r="5" style="--dx: 208px"/>
<g class="alc-step alc-note alc-s6 alc-refused"><rect x="212" y="258" width="216" height="26" rx="13"/><text class="alc-label" x="320" y="276">✗ HTML, whatever its name</text></g>
<g class="alc-step alc-refused alc-s7"><line x1="314" y1="308" x2="114" y2="308"/><polygon points="106,308 116,303 116,313"/><text class="alc-label" x="210" y="300">415 Unsupported Media Type</text></g>
<circle class="alc-dot alc-refused alc-m7" cx="314" cy="308" r="5" style="--dx: -208px"/>
<g class="alc-step alc-banner alc-s8"><rect x="20" y="338" width="600" height="34" rx="17"/><text x="320" y="360">Judged by their bytes, stored under names of the app&#x27;s own</text></g>
</svg>
<figcaption>What it&#x27;s for: files judged by what they are, not by the name or type the client gives, before the app stores them or serves them back.</figcaption>
</figure>

<figure class="alc-anim">
<svg viewBox="0 0 640 382" role="img" aria-labelledby="alc-pagination_cursor-title alc-pagination_cursor-desc" xmlns="http://www.w3.org/2000/svg">
<title id="alc-pagination_cursor-title">PaginationCursor</title>
<desc id="alc-pagination_cursor-desc">Reader to Your app: GET /events?limit=3. Your app to Database: newest, LIMIT 4. Your app to Reader: 200, 30 29 28, next_cursor. Database: event 31 arrives. Reader to Your app: GET ?cursor=… Your app to Database: key &lt; (09:28, 28), LIMIT 4. Your app to Reader: 200, 27 26 25: none twice. The pages don&#x27;t shift, whatever arrives meanwhile.</desc>
<line class="alc-life" x1="100" y1="52" x2="100" y2="330"/>
<g class="alc-actor"><rect x="18" y="10" width="164" height="42" rx="8"/><text x="100" y="36">Reader</text></g>
<line class="alc-life" x1="320" y1="52" x2="320" y2="330"/>
<g class="alc-actor"><rect x="238" y="10" width="164" height="42" rx="8"/><text x="320" y="36">Your app</text></g>
<line class="alc-life" x1="540" y1="52" x2="540" y2="330"/>
<g class="alc-actor"><rect x="458" y="10" width="164" height="42" rx="8"/><text x="540" y="36">Database</text></g>
<g class="alc-step alc-request alc-s1"><line x1="106" y1="92" x2="306" y2="92"/><polygon points="314,92 304,87 304,97"/><text class="alc-label" x="210" y="84">GET /events?limit=3</text></g>
<circle class="alc-dot alc-request alc-m1" cx="106" cy="92" r="5" style="--dx: 208px"/>
<g class="alc-step alc-request alc-s2"><line x1="326" y1="128" x2="526" y2="128"/><polygon points="534,128 524,123 524,133"/><text class="alc-label" x="430" y="120">newest, LIMIT 4</text></g>
<circle class="alc-dot alc-request alc-m2" cx="326" cy="128" r="5" style="--dx: 208px"/>
<g class="alc-step alc-reply alc-s3"><line x1="314" y1="164" x2="114" y2="164"/><polygon points="106,164 116,159 116,169"/><text class="alc-label" x="210" y="156">200, 30 29 28, next_cursor</text></g>
<circle class="alc-dot alc-reply alc-m3" cx="314" cy="164" r="5" style="--dx: -208px"/>
<g class="alc-step alc-note alc-s4"><rect x="466" y="186" width="148" height="26" rx="13"/><text class="alc-label" x="540" y="204">event 31 arrives</text></g>
<g class="alc-step alc-request alc-s5"><line x1="106" y1="236" x2="306" y2="236"/><polygon points="314,236 304,231 304,241"/><text class="alc-label" x="210" y="228">GET ?cursor=…</text></g>
<circle class="alc-dot alc-request alc-m5" cx="106" cy="236" r="5" style="--dx: 208px"/>
<g class="alc-step alc-request alc-s6"><line x1="326" y1="272" x2="526" y2="272"/><polygon points="534,272 524,267 524,277"/><text class="alc-label" x="430" y="264">key &lt; (09:28, 28), LIMIT 4</text></g>
<circle class="alc-dot alc-request alc-m6" cx="326" cy="272" r="5" style="--dx: 208px"/>
<g class="alc-step alc-reply alc-s7"><line x1="314" y1="308" x2="114" y2="308"/><polygon points="106,308 116,303 116,313"/><text class="alc-label" x="210" y="300">200, 27 26 25: none twice</text></g>
<circle class="alc-dot alc-reply alc-m7" cx="314" cy="308" r="5" style="--dx: -208px"/>
<g class="alc-step alc-banner alc-s8"><rect x="20" y="338" width="600" height="34" rx="17"/><text x="320" y="360">The pages don&#x27;t shift, whatever arrives meanwhile</text></g>
</svg>
<figcaption>What it&#x27;s for: feeds and infinite scroll, whose pages don&#x27;t shift when items arrive, with a signed cursor that clients can&#x27;t make up.</figcaption>
</figure>

<figure class="alc-anim">
<svg viewBox="0 0 640 382" role="img" aria-labelledby="alc-webhooks-title alc-webhooks-desc" xmlns="http://www.w3.org/2000/svg">
<title id="alc-webhooks-title">Webhooks in and out</title>
<desc id="alc-webhooks-desc">Payment provider to Your shop: POST /webhooks/payments. Your shop: ✓ signature, fresh, new. Your shop to Payment provider: 204. Payment provider to Your shop: the same delivery again. Your shop to Payment provider: 401, seen already. Your shop to User&#x27;s endpoint: order.paid, signed. User&#x27;s endpoint to Your shop: 200. Signed webhooks in, each once; signed webhooks out.</desc>
<line class="alc-life" x1="100" y1="52" x2="100" y2="330"/>
<g class="alc-actor"><rect x="18" y="10" width="164" height="42" rx="8"/><text x="100" y="36">Payment provider</text></g>
<line class="alc-life" x1="320" y1="52" x2="320" y2="330"/>
<g class="alc-actor"><rect x="238" y="10" width="164" height="42" rx="8"/><text x="320" y="36">Your shop</text></g>
<line class="alc-life" x1="540" y1="52" x2="540" y2="330"/>
<g class="alc-actor"><rect x="458" y="10" width="164" height="42" rx="8"/><text x="540" y="36">User&#x27;s endpoint</text></g>
<g class="alc-step alc-request alc-s1"><line x1="106" y1="92" x2="306" y2="92"/><polygon points="314,92 304,87 304,97"/><text class="alc-label" x="210" y="84">POST /webhooks/payments</text></g>
<circle class="alc-dot alc-request alc-m1" cx="106" cy="92" r="5" style="--dx: 208px"/>
<g class="alc-step alc-note alc-s2"><rect x="220" y="114" width="201" height="26" rx="13"/><text class="alc-label" x="320" y="132">✓ signature, fresh, new</text></g>
<g class="alc-step alc-reply alc-s3"><line x1="314" y1="164" x2="114" y2="164"/><polygon points="106,164 116,159 116,169"/><text class="alc-label" x="210" y="156">204</text></g>
<circle class="alc-dot alc-reply alc-m3" cx="314" cy="164" r="5" style="--dx: -208px"/>
<g class="alc-step alc-request alc-s4"><line x1="106" y1="200" x2="306" y2="200"/><polygon points="314,200 304,195 304,205"/><text class="alc-label" x="210" y="192">the same delivery again</text></g>
<circle class="alc-dot alc-request alc-m4" cx="106" cy="200" r="5" style="--dx: 208px"/>
<g class="alc-step alc-refused alc-s5"><line x1="314" y1="236" x2="114" y2="236"/><polygon points="106,236 116,231 116,241"/><text class="alc-label" x="210" y="228">401, seen already</text></g>
<circle class="alc-dot alc-refused alc-m5" cx="314" cy="236" r="5" style="--dx: -208px"/>
<g class="alc-step alc-request alc-s6"><line x1="326" y1="272" x2="526" y2="272"/><polygon points="534,272 524,267 524,277"/><text class="alc-label" x="430" y="264">order.paid, signed</text></g>
<circle class="alc-dot alc-request alc-m6" cx="326" cy="272" r="5" style="--dx: 208px"/>
<g class="alc-step alc-reply alc-s7"><line x1="534" y1="308" x2="334" y2="308"/><polygon points="326,308 336,303 336,313"/><text class="alc-label" x="430" y="300">200</text></g>
<circle class="alc-dot alc-reply alc-m7" cx="534" cy="308" r="5" style="--dx: -208px"/>
<g class="alc-step alc-banner alc-s8"><rect x="20" y="338" width="600" height="34" rx="17"/><text x="320" y="360">Signed webhooks in, each once; signed webhooks out</text></g>
</svg>
<figcaption>What it&#x27;s for: webhooks taken only when signed with the sender&#x27;s secret, each delivery once, and webhooks sent signed, to URLs that can&#x27;t reach the app&#x27;s own network.</figcaption>
</figure>

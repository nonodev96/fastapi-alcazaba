<figure class="alc-anim">
<svg viewBox="0 0 640 418" role="img" aria-labelledby="alc-pagination_scroll-title alc-pagination_scroll-desc" xmlns="http://www.w3.org/2000/svg">
<title id="alc-pagination_scroll-title">PaginationScroll</title>
<desc id="alc-pagination_scroll-desc">Client to Your app: GET /export?batch_size=4. Your app to Backend: keep the 12 found, 60 s. Your app to Client: 200, 4 items, scroll_id. Your app: order 13 placed: not in it. Client to Your app: GET …?scroll_id=WyJs… Backend to Your app: orders 5 to 8, kept 60 s. Your app to Client: 200, the same if retried. Your app to Client: 404 once it has expired. One query, kept as a snapshot and read batch by batch.</desc>
<line class="alc-life" x1="100" y1="52" x2="100" y2="366"/>
<g class="alc-actor"><rect x="18" y="10" width="164" height="42" rx="8"/><text x="100" y="36">Client</text></g>
<line class="alc-life" x1="320" y1="52" x2="320" y2="366"/>
<g class="alc-actor"><rect x="238" y="10" width="164" height="42" rx="8"/><text x="320" y="36">Your app</text></g>
<line class="alc-life" x1="540" y1="52" x2="540" y2="366"/>
<g class="alc-actor"><rect x="458" y="10" width="164" height="42" rx="8"/><text x="540" y="36">Backend</text></g>
<g class="alc-step alc-request alc-s1"><line x1="106" y1="92" x2="306" y2="92"/><polygon points="314,92 304,87 304,97"/><text class="alc-label" x="210" y="84">GET /export?batch_size=4</text></g>
<circle class="alc-dot alc-request alc-m1" cx="106" cy="92" r="5" style="--dx: 208px"/>
<g class="alc-step alc-request alc-s2"><line x1="326" y1="128" x2="526" y2="128"/><polygon points="534,128 524,123 524,133"/><text class="alc-label" x="430" y="120">keep the 12 found, 60 s</text></g>
<circle class="alc-dot alc-request alc-m2" cx="326" cy="128" r="5" style="--dx: 208px"/>
<g class="alc-step alc-reply alc-s3"><line x1="314" y1="164" x2="114" y2="164"/><polygon points="106,164 116,159 116,169"/><text class="alc-label" x="210" y="156">200, 4 items, scroll_id</text></g>
<circle class="alc-dot alc-reply alc-m3" cx="314" cy="164" r="5" style="--dx: -208px"/>
<g class="alc-step alc-note alc-s4"><rect x="208" y="186" width="224" height="26" rx="13"/><text class="alc-label" x="320" y="204">order 13 placed: not in it</text></g>
<g class="alc-step alc-request alc-s5"><line x1="106" y1="236" x2="306" y2="236"/><polygon points="314,236 304,231 304,241"/><text class="alc-label" x="210" y="228">GET …?scroll_id=WyJs…</text></g>
<circle class="alc-dot alc-request alc-m5" cx="106" cy="236" r="5" style="--dx: 208px"/>
<g class="alc-step alc-reply alc-s6"><line x1="534" y1="272" x2="334" y2="272"/><polygon points="326,272 336,267 336,277"/><text class="alc-label" x="430" y="264">orders 5 to 8, kept 60 s</text></g>
<circle class="alc-dot alc-reply alc-m6" cx="534" cy="272" r="5" style="--dx: -208px"/>
<g class="alc-step alc-reply alc-s7"><line x1="314" y1="308" x2="114" y2="308"/><polygon points="106,308 116,303 116,313"/><text class="alc-label" x="210" y="300">200, the same if retried</text></g>
<circle class="alc-dot alc-reply alc-m7" cx="314" cy="308" r="5" style="--dx: -208px"/>
<g class="alc-step alc-refused alc-s8"><line x1="314" y1="344" x2="114" y2="344"/><polygon points="106,344 116,339 116,349"/><text class="alc-label" x="210" y="336">404 once it has expired</text></g>
<circle class="alc-dot alc-refused alc-m8" cx="314" cy="344" r="5" style="--dx: -208px"/>
<g class="alc-step alc-banner alc-s9"><rect x="20" y="374" width="600" height="34" rx="17"/><text x="320" y="396">One query, kept as a snapshot and read batch by batch</text></g>
</svg>
<figcaption>What it&#x27;s for: a result set read in batches as it was when the scroll started, whatever is written meanwhile: exports and long jobs.</figcaption>
</figure>

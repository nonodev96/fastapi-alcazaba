<figure class="alc-anim">
<svg viewBox="0 0 640 310" role="img" aria-labelledby="alc-authz_service-title alc-authz_service-desc" xmlns="http://www.w3.org/2000/svg">
<title id="alc-authz_service-title">As a separate service</title>
<desc id="alc-authz_service-desc">Your app to Policy service: may ana PUT /articles/7? Policy service to Your app: allow. Other service to Policy service: may ana refund order 9? Policy service to Other service: deny. Other service: down: refuse, never allow. One policy for every service, asked over the network.</desc>
<line class="alc-life" x1="100" y1="52" x2="100" y2="258"/>
<g class="alc-actor"><rect x="18" y="10" width="164" height="42" rx="8"/><text x="100" y="36">Your app</text></g>
<line class="alc-life" x1="320" y1="52" x2="320" y2="258"/>
<g class="alc-actor"><rect x="238" y="10" width="164" height="42" rx="8"/><text x="320" y="36">Other service</text></g>
<line class="alc-life" x1="540" y1="52" x2="540" y2="258"/>
<g class="alc-actor"><rect x="458" y="10" width="164" height="42" rx="8"/><text x="540" y="36">Policy service</text></g>
<g class="alc-step alc-request alc-s1"><line x1="106" y1="92" x2="526" y2="92"/><polygon points="534,92 524,87 524,97"/><text class="alc-label" x="320" y="84">may ana PUT /articles/7?</text></g>
<circle class="alc-dot alc-request alc-m1" cx="106" cy="92" r="5" style="--dx: 428px"/>
<g class="alc-step alc-reply alc-s2"><line x1="534" y1="128" x2="114" y2="128"/><polygon points="106,128 116,123 116,133"/><text class="alc-label" x="320" y="120">allow</text></g>
<circle class="alc-dot alc-reply alc-m2" cx="534" cy="128" r="5" style="--dx: -428px"/>
<g class="alc-step alc-request alc-s3"><line x1="326" y1="164" x2="526" y2="164"/><polygon points="534,164 524,159 524,169"/><text class="alc-label" x="430" y="156">may ana refund order 9?</text></g>
<circle class="alc-dot alc-request alc-m3" cx="326" cy="164" r="5" style="--dx: 208px"/>
<g class="alc-step alc-reply alc-s4"><line x1="534" y1="200" x2="334" y2="200"/><polygon points="326,200 336,195 336,205"/><text class="alc-label" x="430" y="192">deny</text></g>
<circle class="alc-dot alc-reply alc-m4" cx="534" cy="200" r="5" style="--dx: -208px"/>
<g class="alc-step alc-note alc-s5"><rect x="212" y="222" width="216" height="26" rx="13"/><text class="alc-label" x="320" y="240">down: refuse, never allow</text></g>
<g class="alc-step alc-banner alc-s6"><rect x="20" y="266" width="600" height="34" rx="17"/><text x="320" y="288">One policy for every service, asked over the network</text></g>
</svg>
<figcaption>What it&#x27;s for: one policy decision point that every service asks over the network, deployed and audited in one place.</figcaption>
</figure>

<figure class="alc-anim">
<svg viewBox="0 0 640 418" role="img" aria-labelledby="alc-auth_unkey-title alc-auth_unkey-desc" xmlns="http://www.w3.org/2000/svg">
<title id="alc-auth_unkey-title">UnkeyStrategy</title>
<desc id="alc-auth_unkey-desc">Script to Your app: GET /documents, docs_… Your app to Unkey: verifyKey, documents.read. Unkey to Your app: VALID, 99 credits. Your app to Script: 200 [documents]. Script to Your app: POST /documents. Your app to Unkey: verifyKey, documents.write. Unkey to Your app: INSUFFICIENT_PERMISSIONS. Your app to Script: 403 Forbidden. Unkey keeps the keys, and answers for each request.</desc>
<line class="alc-life" x1="100" y1="52" x2="100" y2="366"/>
<g class="alc-actor"><rect x="18" y="10" width="164" height="42" rx="8"/><text x="100" y="36">Script</text></g>
<line class="alc-life" x1="320" y1="52" x2="320" y2="366"/>
<g class="alc-actor"><rect x="238" y="10" width="164" height="42" rx="8"/><text x="320" y="36">Your app</text></g>
<line class="alc-life" x1="540" y1="52" x2="540" y2="366"/>
<g class="alc-actor"><rect x="458" y="10" width="164" height="42" rx="8"/><text x="540" y="36">Unkey</text></g>
<g class="alc-step alc-request alc-s1"><line x1="106" y1="92" x2="306" y2="92"/><polygon points="314,92 304,87 304,97"/><text class="alc-label" x="210" y="84">GET /documents, docs_…</text></g>
<circle class="alc-dot alc-request alc-m1" cx="106" cy="92" r="5" style="--dx: 208px"/>
<g class="alc-step alc-request alc-s2"><line x1="326" y1="128" x2="526" y2="128"/><polygon points="534,128 524,123 524,133"/><text class="alc-label" x="430" y="120">verifyKey, documents.read</text></g>
<circle class="alc-dot alc-request alc-m2" cx="326" cy="128" r="5" style="--dx: 208px"/>
<g class="alc-step alc-reply alc-s3"><line x1="534" y1="164" x2="334" y2="164"/><polygon points="326,164 336,159 336,169"/><text class="alc-label" x="430" y="156">VALID, 99 credits</text></g>
<circle class="alc-dot alc-reply alc-m3" cx="534" cy="164" r="5" style="--dx: -208px"/>
<g class="alc-step alc-reply alc-s4"><line x1="314" y1="200" x2="114" y2="200"/><polygon points="106,200 116,195 116,205"/><text class="alc-label" x="210" y="192">200 [documents]</text></g>
<circle class="alc-dot alc-reply alc-m4" cx="314" cy="200" r="5" style="--dx: -208px"/>
<g class="alc-step alc-request alc-s5"><line x1="106" y1="236" x2="306" y2="236"/><polygon points="314,236 304,231 304,241"/><text class="alc-label" x="210" y="228">POST /documents</text></g>
<circle class="alc-dot alc-request alc-m5" cx="106" cy="236" r="5" style="--dx: 208px"/>
<g class="alc-step alc-request alc-s6"><line x1="326" y1="272" x2="526" y2="272"/><polygon points="534,272 524,267 524,277"/><text class="alc-label" x="430" y="264">verifyKey, documents.write</text></g>
<circle class="alc-dot alc-request alc-m6" cx="326" cy="272" r="5" style="--dx: 208px"/>
<g class="alc-step alc-reply alc-s7"><line x1="534" y1="308" x2="334" y2="308"/><polygon points="326,308 336,303 336,313"/><text class="alc-label" x="430" y="300">INSUFFICIENT_PERMISSIONS</text></g>
<circle class="alc-dot alc-reply alc-m7" cx="534" cy="308" r="5" style="--dx: -208px"/>
<g class="alc-step alc-refused alc-s8"><line x1="314" y1="344" x2="114" y2="344"/><polygon points="106,344 116,339 116,349"/><text class="alc-label" x="210" y="336">403 Forbidden</text></g>
<circle class="alc-dot alc-refused alc-m8" cx="314" cy="344" r="5" style="--dx: -208px"/>
<g class="alc-step alc-banner alc-s9"><rect x="20" y="374" width="600" height="34" rx="17"/><text x="320" y="396">Unkey keeps the keys, and answers for each request</text></g>
</svg>
<figcaption>What it&#x27;s for: API keys that Unkey keeps and checks on every request, with their permissions, credits and rate limits.</figcaption>
</figure>

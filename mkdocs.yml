                  - PaginationOffset: examples/pagination/offset.md
                  - PaginationRange: examples/pagination/range.md
                  - PaginationCursor: examples/pagination/cursor.md
                  - PaginationKeyset: examples/pagination/keyset.md
                  - PaginationScroll: examples/pagination/scroll.md
                  - PaginationStreaming: examples/pagination/streaming.md
              - Rate and concurrency limits: examples/limits.md
              - Idempotency keys: examples/idempotency.md
          - Users and access:
              - Authentication strategies:
                  - examples/auth_strategies/index.md
                  - JWTStrategy: examples/auth_strategies/jwt.md
                  - SessionStrategy: examples/auth_strategies/session.md
                  - HTTPBearerStrategy: examples/auth_strategies/http-bearer.md
                  - OAuth2Strategy: examples/auth_strategies/oauth2.md
                  - OIDCStrategy: examples/auth_strategies/oidc.md
                  - SAMLStrategy: examples/auth_strategies/saml.md
                  - UnkeyStrategy: examples/auth_strategies/unkey.md
                  - Your own strategy: examples/auth_strategies/your-own.md
              - API keys, tokens and codes: examples/auth.md
              - Passwords: examples/passwords.md
              - Second factor: examples/two_factor.md
              - Passkeys: examples/passkeys.md
              - Authorization:
                  - examples/authorization/index.md
                  - In process:
                      - Casbin: examples/authorization/casbin.md
                      - Cedar: examples/authorization/cedar.md
                  - As a separate service:
                      - examples/authorization/service.md
                      - Open Policy Agent: examples/authorization/opa.md
              - A browser app: examples/browser_app.md
          - Input data:
              - Countries and Spain: examples/countries.md
              - Checking uploads: examples/uploads.md
          - Talking to other services:
              - Webhooks in and out: examples/webhooks.md
          - Background and operations:
              - Background work: examples/background.md
              - Operations: examples/operations.md

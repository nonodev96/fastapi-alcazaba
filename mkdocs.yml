      - The tools: features/tools.md
      - Scope and stability: features/scope.md
      - Performance: features/performance.md
  - Learn:
      - learn/index.md
      # In learning order, by what the reader is building: each page needs only those before it,
      # and the previous/next buttons (navigation.footer) follow it.
      - Tutorial - User Guide:
          - guide/index.md
          - Responses and traffic:
              - Response cache: guide/cache.md
              - Pagination:
                  - guide/pagination/index.md
                  - PaginationPageNumber: guide/pagination/page-number.md
                  - PaginationOffset: guide/pagination/offset.md
                  - PaginationRange: guide/pagination/range.md
                  - PaginationCursor: guide/pagination/cursor.md
                  - PaginationKeyset: guide/pagination/keyset.md
                  - PaginationScroll: guide/pagination/scroll.md
                  - PaginationStreaming: guide/pagination/streaming.md
                  - With SQLAlchemy: guide/pagination/sqlalchemy.md
              - Rate and concurrency limits: guide/limits.md
              - Idempotency keys: guide/idempotency.md
          - Users and access:

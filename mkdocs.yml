site_name: Alcazaba
site_description: >-
  Secure, maintained tools for FastAPI: response cache, rate limits, sessions, CSRF, webhooks,
  a task queue and more
# Set by the docs workflow from the repository it runs in.
site_url: !ENV [SITE_URL, "https://nonodev96.github.io/fastapi-alcazaba/"]
repo_url: !ENV [REPO_URL, "https://github.com/nonodev96/fastapi-alcazaba"]
edit_uri: ""
copyright: Copyright © 2026 Antonio Mudarra Machuca. Apache License 2.0
strict: true

theme:
  name: material
  custom_dir: overrides
  logo: assets/logo.svg
  favicon: assets/favicon.png
  icon:
    repo: fontawesome/brands/github
  features:
    - content.code.copy
    # The tabs of one name (pip, uv) switch together, all over the site.
    - content.tabs.link
    - navigation.footer
    - navigation.indexes
    # Where a page is, above its title: Learn > Tutorial - User Guide.
    - navigation.path
    # No navigation.sections: the sections of a tab (Tutorial - User Guide, Examples) open and
    # close in the menu on the left, as in FastAPI's documentation.
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.top
    - search.highlight
    # No search.suggest: Material 9.7.1's has an XSS (GHSA-xvg9-69gf-fjrf).
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle: { icon: material/weather-night, name: Dark mode }
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle: { icon: material/weather-sunny, name: Light mode }

extra_css:
  - stylesheets/brand.css
  - stylesheets/animations.css

# The examples' animations are drawn into their pages (pymdownx.snippets), not served apart.
exclude_docs: |
  examples/animations/

extra:
  # A site per version (dev, 0.3, 0.4...), which the docs workflow publishes with mike; the
  # selector lists them, and the others than the latest release say so (overrides/main.html).
  # The workflow turns it on (DOCS_VERSIONS=mike): `mkdocs serve` has one version, and no
  # versions.json to list them in.
  version:
    provider: !ENV [DOCS_VERSIONS, ""]
    default: latest
    alias: true
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/nonodev96/fastapi-alcazaba
      name: Alcazaba on GitHub
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/fastapi-alcazaba/
      name: fastapi-alcazaba on PyPI


  - Release Notes: changelog.md

markdown_extensions:
  - admonition
  - attr_list
  # Admonitions that open on a click (??? tip).
  - pymdownx.details
  # Content tabs (=== "pip"), with Material's look.
  - pymdownx.tabbed: { alternate_style: true }
  - md_in_html
  - tables
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - toc: { permalink: true }
  - pymdownx.highlight:
      # Each line in a span of its own: the output of a terminal session is left out of copies
      # whole, its line break included (stylesheets/brand.css).
      line_spans: __span
      # A class per language (language-console), for the rules of terminal sessions.
      pygments_lang_class: true
  - pymdownx.superfences
  - pymdownx.snippets: { check_paths: true }

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [.]
          options:
            docstring_style: sphinx
            show_source: false
            show_root_heading: true
            members_order: source
            filters: ["!^_"]
            # Each object a section of its own: its kind in the heading and in the table of
            # contents, the signature apart under it, the constructor's parameters in the class's.
            heading_level: 2
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            separate_signature: true
            show_signature_annotations: true
            merge_init_into_class: true

validation:
  links:
    not_found: warn
    # A link to a heading that isn't there: the guide's sections move between pages.
    anchors: warn
    unrecognized_links: ignore

site_name: Alcazaba
site_description: >-
  Secure, maintained tools for FastAPI: response cache, rate limits, sessions, CSRF, webhooks,
  a task queue and more
# Set by the docs workflow from the repository it runs in.
site_url: !ENV [SITE_URL, "https://nonodev96.github.io/fastapi-alcazaba/"]
repo_url: !ENV [REPO_URL, "https://github.com/nonodev96/fastapi-alcazaba"]
edit_uri: ""
copyright: Copyright © 2026 Antonio Mudarra Machuca · Apache License 2.0
strict: true

theme:
  name: material
  custom_dir: overrides
  logo: assets/logo.svg
  favicon: assets/favicon.png
  icon:
    repo: fontawesome/brands/github
  features:
    - content.code.copy
    - navigation.footer
    - navigation.indexes
    - navigation.sections
    - navigation.tabs
    - navigation.top
    - search.highlight
    # No search.suggest: Material 9.7.1's has an XSS (GHSA-xvg9-69gf-fjrf).
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle: {icon: material/weather-night, name: Dark mode}
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle: {icon: material/weather-sunny, name: Light mode}

extra_css:
  - stylesheets/brand.css

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/nonodev96/fastapi-alcazaba
      name: Alcazaba on GitHub
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/fastapi-alcazaba/
      name: fastapi-alcazaba on PyPI

nav:
  - Home: index.md
  - Examples:
    - examples/index.md
    - Response cache: examples/cache.md
    - Pagination: examples/pagination.md
    - Rate and concurrency limits: examples/limits.md
    - Idempotency keys: examples/idempotency.md
    - API keys, tokens and codes: examples/auth.md
    - A browser app: examples/browser_app.md
    - Audit trail: examples/audit.md
    - Checking uploads: examples/uploads.md
    - Webhooks in and out: examples/webhooks.md
    - Errors and observability: examples/observability.md
    - Background work: examples/background.md
    - Operations: examples/operations.md
  - API reference:
    - reference/index.md
    - Response cache: reference/cache.md
    - Backends: reference/backends.md
    - Pagination: reference/pagination.md
    - Rate and concurrency limits: reference/limits.md
    - Idempotency keys: reference/idempotency.md
    - API keys, tokens and codes: reference/auth.md
    - Sessions, CSRF and security headers: reference/browser.md
    - Audit trail: reference/audit.md
    - Checking uploads: reference/uploads.md
    - Webhooks and outbound calls: reference/webhooks.md
    - Errors and observability: reference/observability.md
    - Background work: reference/background.md
    - Operations: reference/operations.md
    - Integrity, resilience and errors: reference/integrity.md
  - Project:
    - Security policy: security.md
    - Deployment and releases: releasing.md
    - Verifying releases: verifying.md
    - Changelog: changelog.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - toc: {permalink: true}
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.snippets: {check_paths: true}

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [.]
          options:
            docstring_style: sphinx
            show_source: false
            show_root_heading: true
            members_order: source
            filters: ["!^_"]
            # Each object a section of its own: its kind in the heading and in the table of
            # contents, the signature apart under it, the constructor's parameters in the class's.
            heading_level: 2
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            separate_signature: true
            show_signature_annotations: true
            merge_init_into_class: true

validation:
  links:
    not_found: warn
    unrecognized_links: ignore

                  - SessionStrategy: guide/authentication/session.md
                  - HTTPBearerStrategy: guide/authentication/http-bearer.md
                  - OAuth2Strategy: guide/authentication/oauth2.md
                  - OIDCStrategy: guide/authentication/oidc.md
                  - SAMLStrategy: guide/authentication/saml.md
                  - UnkeyStrategy: guide/authentication/unkey.md
                  - Your own strategy: guide/authentication/your-own.md
              - API keys, tokens and codes: guide/auth.md
              - Passwords: guide/passwords.md
              - Second factor: guide/two-factor.md
              - Passkeys: guide/passkeys.md
              - Authorization:
                  - guide/authorization/index.md
                  - In process:
                      - Casbin: guide/authorization/casbin.md
                      - Cedar: guide/authorization/cedar.md
                  - As a separate service:
                      - guide/authorization/service.md
                      - Open Policy Agent: guide/authorization/opa.md
              - Sessions, CSRF and security headers: guide/browser.md
          - Input data:
              - Countries and Spain: guide/countries.md
              - Checking uploads: guide/uploads.md

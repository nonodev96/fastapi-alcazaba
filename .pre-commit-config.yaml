# Install once, after `make deps`: .venv/bin/pre-commit install --install-hooks -t pre-commit -t pre-push
# The Python tools run from the project's environment (.venv), the same versions as `make lint`.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c # frozen: v6.0.0
    hooks:
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: check-toml
      - id: check-yaml
        args: [--unsafe] # mkdocs.yml uses !ENV tags
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: trailing-whitespace

  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: .venv/bin/ruff check --fix
        language: system
        types: [python]
        require_serial: true
      # Before ruff format: the comma it adds makes the formatter put one parameter per line.
      - id: signatures
        name: multi-line signatures end with a comma
        entry: .venv/bin/python scripts/check_signatures.py --fix
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: .venv/bin/ruff format
        language: system
        types_or: [python, markdown]
        require_serial: true
      - id: mypy
        name: mypy
        entry: .venv/bin/mypy
        language: system
        types: [python]
        pass_filenames: false
      - id: pylint
        name: pylint
        entry: .venv/bin/pylint
        language: system
        types: [python]
        require_serial: true
      - id: workflows
        name: zizmor and actionlint
        # actionlint finds shellcheck on the PATH.
        entry: bash -c 'PATH=".venv/bin:$PATH" && zizmor --offline .github/ && actionlint'
        language: system
        files: ^\.github/(workflows|actions)/
        pass_filenames: false
      - id: unit-tests
        name: unit tests
        entry: .venv/bin/pytest -q tests/unit tests/typing
        language: system
        pass_filenames: false
        stages: [pre-push]
